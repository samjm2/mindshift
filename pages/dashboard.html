<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — MindShift</title>
  <meta name="description" content="Your personalized learning dashboard on MindShift. Track courses, achievements, and upcoming sessions.">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Design System -->
  <link rel="stylesheet" href="../css/design-system.css">

  <!-- Page-specific styles -->
  <style>
    /* ---- Welcome Header ---- */
    .welcome-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: var(--space-6);
      margin-bottom: var(--space-8);
    }

    .welcome-text h1 {
      font-size: var(--text-3xl);
      font-weight: var(--weight-extrabold);
      letter-spacing: -0.03em;
      margin-bottom: var(--space-2);
      background: linear-gradient(135deg, var(--color-text-primary) 0%, var(--color-action-blue) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .welcome-subtitle {
      font-size: var(--text-base);
      color: var(--color-text-secondary);
      margin-bottom: var(--space-2);
      max-width: none;
    }

    .welcome-date {
      font-size: var(--text-sm);
      color: var(--color-text-tertiary);
    }

    .welcome-actions {
      flex-shrink: 0;
      display: flex;
      align-items: center;
    }

    /* ---- Stat Cards Grid ---- */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--space-6);
      margin-bottom: var(--space-8);
    }

    .stat-card {
      position: relative;
      overflow: hidden;
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      opacity: 0.06;
      transform: translate(20px, -20px);
      transition: opacity var(--transition-base);
    }

    .stat-card:hover::before {
      opacity: 0.1;
    }

    .stat-card-blue::before { background: var(--color-action-blue); }
    .stat-card-green::before { background: var(--color-success); }
    .stat-card-yellow::before { background: var(--color-warning); }
    .stat-card-purple::before { background: #8B5CF6; }

    .stat-card .stat-icon {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: var(--space-4);
      transition: transform var(--transition-spring);
    }

    .stat-card:hover .stat-icon {
      transform: scale(1.1);
    }

    .stat-card .stat-icon svg {
      width: 20px;
      height: 20px;
    }

    .stat-icon-blue {
      background: var(--color-accent-blue);
      color: var(--color-action-blue);
    }

    .stat-icon-green {
      background: var(--color-success-bg);
      color: var(--color-success);
    }

    .stat-icon-yellow {
      background: var(--color-warning-bg);
      color: var(--color-warning);
    }

    .stat-icon-purple {
      background: rgba(139, 92, 246, 0.12);
      color: #8B5CF6;
    }

    [data-theme="dark"] .stat-icon-purple {
      background: rgba(139, 92, 246, 0.15);
      color: #A78BFA;
    }

    .stat-card .stat-label {
      margin-bottom: var(--space-2);
    }

    .stat-card .stat-value {
      margin-bottom: var(--space-1);
    }

    .stat-card .stat-sub {
      font-size: var(--text-xs);
      color: var(--color-text-tertiary);
      font-weight: var(--weight-medium);
    }

    /* ---- Current Course Card ---- */
    .current-course {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: var(--space-8);
      margin-bottom: var(--space-8);
      border-left: 4px solid var(--color-action-blue);
      position: relative;
      overflow: hidden;
    }

    .current-course::after {
      content: '';
      position: absolute;
      top: -40px;
      right: -40px;
      width: 160px;
      height: 160px;
      background: var(--color-action-blue);
      opacity: 0.03;
      border-radius: 50%;
      pointer-events: none;
      transition: opacity var(--transition-base);
    }

    .current-course:hover::after {
      opacity: 0.06;
    }

    .current-course-info {
      flex: 1;
      min-width: 0;
    }

    .current-course-badge {
      margin-bottom: var(--space-3);
    }

    .current-course-title {
      font-size: var(--text-xl);
      font-weight: var(--weight-bold);
      color: var(--color-text-primary);
      margin-bottom: var(--space-1);
      letter-spacing: -0.01em;
    }

    .current-course-module {
      font-size: var(--text-sm);
      color: var(--color-text-secondary);
      margin-bottom: var(--space-5);
    }

    .current-course-progress {
      margin-bottom: var(--space-4);
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--space-2);
    }

    .progress-label span {
      font-size: var(--text-xs);
      color: var(--color-text-tertiary);
      font-weight: var(--weight-medium);
    }

    .progress-label strong {
      font-size: var(--text-sm);
      color: var(--color-action-blue);
      font-weight: var(--weight-semibold);
    }

    @keyframes progressFill {
      from { width: 0; }
    }

    .progress-bar-animated .progress-bar-fill {
      animation: progressFill 1.2s var(--ease-out) both;
    }

    .current-course-meta {
      display: flex;
      align-items: center;
      gap: var(--space-6);
      margin-bottom: var(--space-4);
    }

    .course-meta-item {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      font-size: var(--text-xs);
      color: var(--color-text-tertiary);
      font-weight: var(--weight-medium);
    }

    .course-meta-item svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }

    .next-lesson {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      font-size: var(--text-sm);
      color: var(--color-text-secondary);
      padding: var(--space-3) var(--space-4);
      background: var(--color-bg);
      border-radius: var(--radius-md);
      margin-bottom: var(--space-4);
      transition: background var(--transition-fast);
    }

    .next-lesson:hover {
      background: var(--color-accent-blue-light);
    }

    .next-lesson svg {
      width: 14px;
      height: 14px;
      color: var(--color-action-blue);
      flex-shrink: 0;
    }

    .next-lesson-label {
      font-size: var(--text-xs);
      color: var(--color-text-tertiary);
      font-weight: var(--weight-semibold);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-right: var(--space-1);
    }

    .current-course-actions {
      flex-shrink: 0;
      display: flex;
      align-items: flex-start;
      position: relative;
      z-index: 1;
    }

    /* ---- Two-Column Dashboard Layout ---- */
    .dashboard-columns {
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      gap: var(--space-6);
    }

    .dashboard-col {
      display: flex;
      flex-direction: column;
      gap: var(--space-6);
    }

    /* ---- Card Section Headers ---- */
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--space-5);
    }

    .card-header h3 {
      font-size: var(--text-md);
      font-weight: var(--weight-semibold);
      letter-spacing: -0.01em;
    }

    /* ---- Session List ---- */
    .session-list {
      list-style: none;
    }

    .session-item {
      display: flex;
      align-items: flex-start;
      gap: var(--space-4);
      padding: var(--space-4) 0;
      border-bottom: 1px solid var(--color-border-light);
      transition: background var(--transition-fast);
    }

    .session-item:first-child {
      padding-top: 0;
    }

    .session-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .session-time-block {
      flex-shrink: 0;
      width: 56px;
      text-align: center;
      padding: var(--space-2) var(--space-1);
      background: var(--color-bg);
      border-radius: var(--radius-md);
      transition: background var(--transition-fast);
    }

    .session-item:hover .session-time-block {
      background: var(--color-accent-blue-light);
    }

    .session-day {
      font-size: var(--text-xs);
      font-weight: var(--weight-bold);
      color: var(--color-action-blue);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .session-time {
      font-size: 11px;
      color: var(--color-text-tertiary);
      margin-top: 2px;
      font-weight: var(--weight-medium);
    }

    .session-details {
      flex: 1;
      min-width: 0;
    }

    .session-title {
      font-size: var(--text-sm);
      font-weight: var(--weight-semibold);
      color: var(--color-text-primary);
      margin-bottom: 2px;
    }

    .session-instructor {
      font-size: var(--text-xs);
      color: var(--color-text-tertiary);
    }

    .session-badge {
      flex-shrink: 0;
    }

    /* ---- Activity List ---- */
    .activity-list {
      list-style: none;
    }

    .activity-item {
      display: flex;
      align-items: flex-start;
      gap: var(--space-3);
      padding: var(--space-3) 0;
      border-bottom: 1px solid var(--color-border-light);
      transition: opacity var(--transition-fast);
    }

    .activity-item:first-child {
      padding-top: 0;
    }

    .activity-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .activity-item:hover {
      opacity: 0.85;
    }

    .activity-icon {
      width: 30px;
      height: 30px;
      border-radius: var(--radius-full);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
      transition: transform var(--transition-fast);
    }

    .activity-item:hover .activity-icon {
      transform: scale(1.08);
    }

    .activity-icon svg {
      width: 14px;
      height: 14px;
    }

    .activity-icon-blue {
      background: var(--color-accent-blue);
      color: var(--color-action-blue);
    }

    .activity-icon-green {
      background: var(--color-success-bg);
      color: var(--color-success);
    }

    .activity-icon-yellow {
      background: var(--color-warning-bg);
      color: var(--color-warning);
    }

    .activity-icon-purple {
      background: rgba(139, 92, 246, 0.12);
      color: #8B5CF6;
    }

    [data-theme="dark"] .activity-icon-purple {
      background: rgba(139, 92, 246, 0.15);
      color: #A78BFA;
    }

    .activity-content {
      flex: 1;
      min-width: 0;
    }

    .activity-text {
      font-size: var(--text-sm);
      color: var(--color-text-primary);
      line-height: var(--leading-normal);
    }

    .activity-time {
      font-size: var(--text-xs);
      color: var(--color-text-tertiary);
      margin-top: 2px;
    }

    /* ---- Achievement List ---- */
    .achievement-list {
      list-style: none;
    }

    .achievement-item {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      padding: var(--space-3) 0;
      border-bottom: 1px solid var(--color-border-light);
      transition: background var(--transition-fast);
    }

    .achievement-item:first-child {
      padding-top: 0;
    }

    .achievement-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .achievement-icon {
      width: 38px;
      height: 38px;
      border-radius: var(--radius-full);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform var(--transition-spring);
    }

    .achievement-item:hover .achievement-icon {
      transform: scale(1.1) rotate(5deg);
    }

    .achievement-icon svg {
      width: 16px;
      height: 16px;
    }

    .achievement-icon-blue {
      background: var(--color-accent-blue);
      color: var(--color-action-blue);
    }

    .achievement-icon-green {
      background: var(--color-success-bg);
      color: var(--color-success);
    }

    .achievement-icon-yellow {
      background: var(--color-warning-bg);
      color: var(--color-warning);
    }

    .achievement-icon-purple {
      background: rgba(139, 92, 246, 0.12);
      color: #8B5CF6;
    }

    [data-theme="dark"] .achievement-icon-purple {
      background: rgba(139, 92, 246, 0.15);
      color: #A78BFA;
    }

    .achievement-info {
      flex: 1;
      min-width: 0;
    }

    .achievement-name {
      font-size: var(--text-sm);
      font-weight: var(--weight-semibold);
      color: var(--color-text-primary);
    }

    .achievement-desc {
      font-size: var(--text-xs);
      color: var(--color-text-tertiary);
      margin-top: 1px;
    }

    /* ---- Friends Activity ---- */
    .friends-list {
      list-style: none;
    }

    .friend-item {
      display: flex;
      align-items: flex-start;
      gap: var(--space-3);
      padding: var(--space-3) 0;
      border-bottom: 1px solid var(--color-border-light);
    }

    .friend-item:first-child {
      padding-top: 0;
    }

    .friend-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .friend-avatar {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-full);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: var(--text-xs);
      font-weight: var(--weight-semibold);
      transition: transform var(--transition-fast), box-shadow var(--transition-fast);
    }

    .friend-item:hover .friend-avatar {
      transform: scale(1.08);
      box-shadow: var(--shadow-sm);
    }

    .friend-avatar-blue {
      background: var(--color-accent-blue);
      color: var(--color-deep-blue);
    }

    .friend-avatar-green {
      background: var(--color-success-bg);
      color: var(--color-success);
    }

    .friend-avatar-purple {
      background: rgba(139, 92, 246, 0.12);
      color: #8B5CF6;
    }

    [data-theme="dark"] .friend-avatar-purple {
      background: rgba(139, 92, 246, 0.15);
      color: #A78BFA;
    }

    .friend-content {
      flex: 1;
      min-width: 0;
    }

    .friend-text {
      font-size: var(--text-sm);
      color: var(--color-text-primary);
      line-height: var(--leading-normal);
    }

    .friend-text strong {
      font-weight: var(--weight-semibold);
    }

    .friend-time {
      font-size: var(--text-xs);
      color: var(--color-text-tertiary);
      margin-top: 2px;
    }

    /* ---- Entrance Animations ---- */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    [data-animate].animate-in {
      animation: fadeInUp 0.5s var(--ease-out) both;
    }

    [data-animate="delay-1"].animate-in { animation-delay: 0.05s; }
    [data-animate="delay-2"].animate-in { animation-delay: 0.1s; }
    [data-animate="delay-3"].animate-in { animation-delay: 0.15s; }
    [data-animate="delay-4"].animate-in { animation-delay: 0.2s; }
    [data-animate="delay-5"].animate-in { animation-delay: 0.25s; }
    [data-animate="delay-6"].animate-in { animation-delay: 0.3s; }
    [data-animate="delay-7"].animate-in { animation-delay: 0.35s; }
    [data-animate="delay-8"].animate-in { animation-delay: 0.4s; }

    /* ---- Loading State ---- */
    .dashboard-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 40vh;
      gap: var(--space-4);
      color: var(--color-text-tertiary);
    }

    .dashboard-loading .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--color-border-light);
      border-top-color: var(--color-action-blue);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ---- Empty State ---- */
    .empty-state {
      text-align: center;
      padding: var(--space-8) var(--space-4);
      color: var(--color-text-tertiary);
      font-size: var(--text-sm);
    }

    .empty-state a {
      color: var(--color-action-blue);
      font-weight: var(--weight-semibold);
      text-decoration: none;
    }

    .empty-state a:hover {
      text-decoration: underline;
    }

    /* ---- Notification Badge ---- */
    .notif-badge {
      position: absolute;
      top: 4px;
      right: 4px;
      min-width: 16px;
      height: 16px;
      padding: 0 4px;
      background: var(--color-error, #EF4444);
      color: #fff;
      font-size: 10px;
      font-weight: var(--weight-bold);
      border-radius: var(--radius-full);
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      pointer-events: none;
    }

    /* ---- Responsive ---- */
    @media (max-width: 1024px) {
      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .dashboard-columns {
        grid-template-columns: 1fr;
      }

      .current-course {
        flex-direction: column;
        gap: var(--space-4);
      }

      .current-course-actions {
        align-self: flex-start;
      }
    }

    @media (max-width: 768px) {
      .welcome-header {
        flex-direction: column;
        gap: var(--space-4);
      }

      .welcome-text h1 {
        font-size: var(--text-2xl);
      }

      .welcome-actions {
        align-self: flex-start;
      }

      .current-course-meta {
        flex-wrap: wrap;
        gap: var(--space-3);
      }
    }

    @media (max-width: 480px) {
      .stats-grid {
        grid-template-columns: 1fr;
      }

      .session-item {
        flex-wrap: wrap;
      }

      .session-badge {
        margin-left: calc(56px + var(--space-4));
      }
    }
  </style>
</head>
<body>
  <div id="sidebar-container"></div>
  <div id="topbar-container"></div>

  <div class="page-layout">
    <main class="page-content" role="main">
      <!-- Loading state shown until data arrives -->
      <div id="dashboard-loading" class="dashboard-loading">
        <div class="spinner"></div>
        <span>Loading your dashboard...</span>
      </div>

      <!-- Dashboard content, hidden until populated -->
      <div id="dashboard-content" style="display:none;"></div>
    </main>
  </div>

  <!-- API client (must come before shared.js) -->
  <script src="../js/api.js"></script>
  <!-- Shared JS -->
  <script src="../js/shared.js"></script>
  <script>
    document.getElementById('sidebar-container').innerHTML = renderSidebar();
    document.getElementById('topbar-container').innerHTML = renderTopbar('Dashboard');
    initSidebar();

    (async function loadDashboard() {
      // Auth guard
      const user = await requireLogin();
      if (!user) return;

      // Fetch dashboard data
      const data = await API.getDashboard();
      if (data.error) {
        document.getElementById('dashboard-loading').innerHTML =
          '<span>Failed to load dashboard. Please try again.</span>';
        return;
      }

      // --- Notification badge on topbar bell icon ---
      if (data.unreadNotifications > 0) {
        const bellBtn = document.querySelector('[aria-label="Notifications"]');
        if (bellBtn) {
          bellBtn.style.position = 'relative';
          const badge = document.createElement('span');
          badge.className = 'notif-badge';
          badge.textContent = data.unreadNotifications > 99 ? '99+' : data.unreadNotifications;
          bellBtn.appendChild(badge);
        }
      }

      // --- Update topbar avatar with real user initials ---
      const avatarEl = document.querySelector('.topbar .avatar');
      if (avatarEl && data.user && data.user.username) {
        avatarEl.textContent = getInitials(data.user.username);
        avatarEl.setAttribute('data-tooltip', data.user.username);
        avatarEl.setAttribute('aria-label', data.user.username);
      }

      // --- Compute values ---
      const enrollments = data.enrollments || [];
      const activeEnrollments = enrollments.filter(e => e.status !== 'completed');
      const coursesInProgress = activeEnrollments.length;

      const totalMinutes = (data.progress && data.progress.total_learning_minutes) || 0;
      const totalHours = (totalMinutes / 60).toFixed(1);

      const achievementsEarned = data.achievementsEarned || 0;
      const achievementsTotal = data.achievementsTotal || 0;
      const achievementPct = achievementsTotal > 0
        ? Math.round((achievementsEarned / achievementsTotal) * 100)
        : 0;

      const streakDays = (data.progress && data.progress.streak_days) || 0;

      const COURSE_TITLES = {
        'ai-fundamentals': 'AI Fundamentals',
        'machine-learning': 'Machine Learning Fundamentals',
        'deep-learning': 'Deep Learning',
        'nlp': 'Natural Language Processing',
        'computer-vision': 'Computer Vision',
        'ai-ethics': 'AI Ethics & Responsible AI',
        'python-for-ai': 'Python for AI',
        'reinforcement-learning': 'Reinforcement Learning'
      };
      const currentCourse = activeEnrollments.length > 0 ? activeEnrollments[0] : null;

      const upcomingSessions = data.upcomingSessions || [];
      const recentActivity = data.recentActivity || [];

      // --- Format today's date ---
      const today = new Date();
      const dateStr = today.toLocaleDateString('en-US', {
        weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
      });

      // --- Build the HTML ---
      let html = '';

      // Welcome header
      const username = (data.user && data.user.username) || 'Learner';
      html += `
      <section class="welcome-header" data-animate aria-label="Welcome">
        <div class="welcome-text">
          <h1>Welcome back, ${escapeHtml(username)}</h1>
          <p class="welcome-subtitle">${coursesInProgress > 0 ? 'Continue where you left off' : 'Ready to start learning?'}</p>
          <span class="welcome-date">
            <time datetime="${today.toISOString().split('T')[0]}">${dateStr}</time>
          </span>
        </div>
        <div class="welcome-actions">
          <a href="courses.html" class="btn btn-primary btn-lg">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            ${coursesInProgress > 0 ? 'Resume Learning' : 'Browse Courses'}
          </a>
        </div>
      </section>`;

      // Stat cards
      html += `
      <section class="stats-grid" aria-label="Learning statistics">
        <div class="stat-card stat-card-blue" data-animate="delay-1">
          <div class="stat-icon stat-icon-blue">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>
          </div>
          <div class="stat-label">Courses In Progress</div>
          <div class="stat-value">${coursesInProgress}</div>
          <div class="stat-change">${coursesInProgress === 1 ? '1 active enrollment' : coursesInProgress + ' active enrollments'}</div>
        </div>

        <div class="stat-card stat-card-green" data-animate="delay-2">
          <div class="stat-icon stat-icon-green">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          </div>
          <div class="stat-label">Learning Time</div>
          <div class="stat-value">${totalHours} <span class="stat-sub">hrs</span></div>
          <div class="stat-change">Total time invested</div>
        </div>

        <div class="stat-card stat-card-yellow" data-animate="delay-3">
          <div class="stat-icon stat-icon-yellow">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg>
          </div>
          <div class="stat-label">Achievements</div>
          <div class="stat-value">${achievementsEarned} <span class="stat-sub">of ${achievementsTotal}</span></div>
          <div class="stat-change">${achievementPct}% unlocked</div>
        </div>

        <div class="stat-card stat-card-purple" data-animate="delay-4">
          <div class="stat-icon stat-icon-purple">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
          </div>
          <div class="stat-label">Streak</div>
          <div class="stat-value">${streakDays} <span class="stat-sub">days</span></div>
          <div class="stat-change">${streakDays > 0 ? 'Keep it going!' : 'Start a streak today!'}</div>
        </div>
      </section>`;

      // All courses — active + completed
      const completedEnrollments = enrollments.filter(e => e.status === 'completed' || e.progress_percent >= 100);
      const allUserCourses = [...activeEnrollments, ...completedEnrollments];

      if (allUserCourses.length > 0) {
        html += `<section class="section" data-animate="delay-5" aria-label="Your courses">
          <div class="section-header"><h2>Your Courses</h2><a href="courses.html" class="btn btn-ghost btn-sm">Browse All</a></div>`;
        for (const course of allUserCourses) {
          const progress = course.progress_percent || 0;
          const courseTitle = COURSE_TITLES[course.course_id] || course.course_id;
          const isCompleted = course.status === 'completed' || progress >= 100;

          if (isCompleted) {
            html += `
          <div class="card current-course" style="margin-bottom: var(--space-4); border-left-color: var(--color-success);">
            <div class="current-course-info">
              <div class="current-course-badge">
                <span class="badge badge-green">Completed</span>
              </div>
              <h2 class="current-course-title">${escapeHtml(courseTitle)}</h2>
              <div style="display:flex;align-items:center;gap:var(--space-2);color:var(--color-success);font-size:var(--text-sm);font-weight:600;margin-top:var(--space-2);">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M6 9H4.5a2.5 2.5 0 010-5H6"/><path d="M18 9h1.5a2.5 2.5 0 000-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20 17 22"/><path d="M18 2H6v7a6 6 0 0012 0V2z"/></svg>
                100% Complete
              </div>
            </div>
            <div class="current-course-actions">
              <a href="course-detail.html?course=${course.course_id}" class="btn btn-secondary">
                Review Course
              </a>
            </div>
          </div>`;
          } else {
            html += `
          <div class="card current-course" style="margin-bottom: var(--space-4);">
            <div class="current-course-info">
              <div class="current-course-badge">
                <span class="badge badge-blue">${progress > 0 ? 'In Progress' : 'Enrolled'}</span>
              </div>
              <h2 class="current-course-title">${escapeHtml(courseTitle)}</h2>
              <div class="current-course-progress progress-bar-animated">
                <div class="progress-label">
                  <span>Progress</span>
                  <strong>${progress}%</strong>
                </div>
                <div class="progress-bar">
                  <div class="progress-bar-fill" style="width: ${progress}%;" role="progressbar" aria-valuenow="${progress}" aria-valuemin="0" aria-valuemax="100"></div>
                </div>
              </div>
            </div>
            <div class="current-course-actions">
              <a href="course-detail.html?course=${course.course_id}" class="btn btn-primary">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                Continue
              </a>
            </div>
          </div>`;
          }
        }
        html += `</section>`;
      } else {
        html += `
      <section class="card current-course" data-animate="delay-5" aria-label="Current course" style="border-left-color: var(--color-text-tertiary);">
        <div class="empty-state" style="width:100%;">
          <p>No courses yet. <a href="courses.html">Start a course to begin learning!</a></p>
        </div>
      </section>`;
      }

      // Two-column layout
      html += `<div class="dashboard-columns">`;

      // Left column
      html += `<div class="dashboard-col">`;

      // Upcoming sessions
      html += `
          <section class="card" data-animate="delay-6" aria-label="Upcoming sessions">
            <div class="card-header">
              <h3>Upcoming Sessions</h3>
              <a href="schedule.html" class="btn btn-ghost btn-sm">View Schedule</a>
            </div>`;
      if (upcomingSessions.length > 0) {
        html += `<ul class="session-list">`;
        for (const session of upcomingSessions) {
          // API returns session_date + start_time as separate fields
          const dateField = session.session_date || session.sessionDate || session.date || '';
          const sDate = dateField ? new Date(dateField + 'T00:00:00') : null;
          const dayStr = sDate && !isNaN(sDate) ? sDate.toLocaleDateString('en-US', { weekday: 'short' }) : '';
          const timeStr = session.start_time || session.startTime || '';
          const sTitle = session.title || session.name || 'Session';
          const sInstructor = session.tutor_name || session.tutorName || session.instructor || '';
          const sType = session.session_type || session.sessionType || session.type || 'Tutoring';
          const badgeClass = sType.toLowerCase().includes('group') ? 'badge-yellow' : 'badge-blue';
          html += `
              <li class="session-item">
                <div class="session-time-block">
                  <div class="session-day">${escapeHtml(dayStr)}</div>
                  <div class="session-time">${escapeHtml(timeStr)}</div>
                </div>
                <div class="session-details">
                  <div class="session-title">${escapeHtml(sTitle)}</div>
                  ${sInstructor ? `<div class="session-instructor">${escapeHtml(sInstructor)}</div>` : ''}
                </div>
                <div class="session-badge">
                  <span class="badge ${badgeClass}">${escapeHtml(sType)}</span>
                </div>
              </li>`;
        }
        html += `</ul>`;
      } else {
        html += `<div class="empty-state">No upcoming sessions.</div>`;
      }
      html += `</section>`;

      // Recent activity
      html += `
          <section class="card" data-animate="delay-7" aria-label="Recent activity">
            <div class="card-header">
              <h3>Recent Activity</h3>
            </div>`;
      if (recentActivity.length > 0) {
        html += `<ul class="activity-list">`;
        const iconColors = ['green', 'blue', 'yellow', 'purple'];
        const activityIcons = {
          green: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
          blue: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>',
          yellow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg>',
          purple: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>'
        };
        recentActivity.forEach((item, idx) => {
          const color = iconColors[idx % iconColors.length];
          const text = item.detail || item.text || item.action || '';
          const ago = item.created_at ? timeAgo(item.created_at) : (item.time || '');
          html += `
              <li class="activity-item">
                <div class="activity-icon activity-icon-${color}">
                  ${activityIcons[color]}
                </div>
                <div class="activity-content">
                  <div class="activity-text">${escapeHtml(text)}</div>
                  <div class="activity-time">${escapeHtml(ago)}</div>
                </div>
              </li>`;
        });
        html += `</ul>`;
      } else {
        html += `<div class="empty-state">No activity yet.</div>`;
      }
      html += `</section>`;

      html += `</div>`; // end left col

      // Right column
      html += `<div class="dashboard-col">`;

      // Achievements
      html += `
          <section class="card" data-animate="delay-6" aria-label="Recent achievements">
            <div class="card-header">
              <h3>Achievements</h3>
              <a href="achievements.html" class="btn btn-ghost btn-sm">View All</a>
            </div>`;
      if (achievementsEarned > 0 && data.achievements && data.achievements.length > 0) {
        html += `<ul class="achievement-list">`;
        const achColors = ['yellow', 'blue', 'green', 'purple'];
        const achIcons = {
          yellow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>',
          blue: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>',
          green: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>',
          purple: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>'
        };
        const earned = data.achievements.filter(a => a.earned || a.unlocked);
        const displayAch = earned.length > 0 ? earned.slice(0, 4) : data.achievements.slice(0, 4);
        displayAch.forEach((ach, idx) => {
          const color = achColors[idx % achColors.length];
          html += `
              <li class="achievement-item">
                <div class="achievement-icon achievement-icon-${color}">
                  ${achIcons[color]}
                </div>
                <div class="achievement-info">
                  <div class="achievement-name">${escapeHtml(ach.name || ach.title || '')}</div>
                  <div class="achievement-desc">${escapeHtml(ach.description || ach.desc || '')}</div>
                </div>
              </li>`;
        });
        html += `</ul>`;
      } else {
        html += `<div class="empty-state">No achievements earned yet. <a href="achievements.html">View all achievements</a></div>`;
      }
      html += `</section>`;

      // Friends Activity (keep as empty-state if no data, or show if provided)
      html += `
          <section class="card" data-animate="delay-7" aria-label="Friends activity">
            <div class="card-header">
              <h3>Friends Activity</h3>
            </div>`;
      const friends = data.friendsActivity || [
        { name: 'Alex Rivera', text: 'completed the Deep Learning course', time: '2h ago' },
        { name: 'Priya Sharma', text: 'earned the "Unstoppable" achievement', time: '5h ago' },
        { name: 'Marcus Johnson', text: 'enrolled in Computer Vision', time: '1d ago' }
      ];
      if (friends.length > 0) {
        html += `<ul class="friends-list">`;
        const fColors = ['blue', 'purple', 'green'];
        friends.forEach((f, idx) => {
          const color = fColors[idx % fColors.length];
          const name = f.name || f.username || 'Friend';
          const initials = getInitials(name);
          const text = f.text || f.action || '';
          const ago = f.created_at ? timeAgo(f.created_at) : (f.time || '');
          html += `
              <li class="friend-item">
                <div class="friend-avatar friend-avatar-${color}">${escapeHtml(initials)}</div>
                <div class="friend-content">
                  <div class="friend-text"><strong>${escapeHtml(name)}</strong> ${escapeHtml(text)}</div>
                  <div class="friend-time">${escapeHtml(ago)}</div>
                </div>
              </li>`;
        });
        html += `</ul>`;
      } else {
        html += `<div class="empty-state">No friends activity yet.</div>`;
      }
      html += `</section>`;

      html += `</div>`; // end right col
      html += `</div>`; // end dashboard-columns

      // Inject content and reveal
      document.getElementById('dashboard-loading').style.display = 'none';
      const contentEl = document.getElementById('dashboard-content');
      contentEl.innerHTML = html;
      contentEl.style.display = '';

      // Re-init animations for the new dynamic content
      initAnimations();
      // Apply saved profile pic
      applyUserProfilePic();
    })();

    // Utility: escape HTML to prevent XSS
    function escapeHtml(str) {
      if (!str) return '';
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }
  </script>
</body>
</html>
