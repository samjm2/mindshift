<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course — MindShift</title>
  <meta name="description" content="Learn at your own pace with MindShift courses. Watch videos, read articles, and test your knowledge with quizzes.">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Design System -->
  <link rel="stylesheet" href="../css/design-system.css">

  <!-- Page-specific styles -->
  <style>
    /* ---- Two-panel layout ---- */
    .course-detail-layout {
      display: flex;
      min-height: calc(100vh - var(--navbar-height));
    }

    /* ---- Course Sidebar (left panel) ---- */
    .course-sidebar {
      width: 280px;
      min-width: 280px;
      background: var(--color-surface);
      border-right: 1px solid var(--color-border);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      max-height: calc(100vh - var(--navbar-height));
      position: sticky;
      top: var(--navbar-height);
    }

    .course-sidebar-header {
      padding: var(--space-5);
      border-bottom: 1px solid var(--color-border-light);
    }

    .course-sidebar-title {
      font-size: var(--text-md);
      font-weight: var(--weight-bold);
      color: var(--color-text-primary);
      line-height: var(--leading-snug);
      margin-bottom: var(--space-3);
    }

    .course-sidebar-progress-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--space-1);
    }

    .course-sidebar-progress-label span {
      font-size: var(--text-xs);
      color: var(--color-text-tertiary);
      font-weight: var(--weight-medium);
    }

    .course-sidebar-progress-label strong {
      font-size: var(--text-xs);
      color: var(--color-action-blue);
      font-weight: var(--weight-semibold);
    }

    /* ---- Module / lesson nav ---- */
    .module-nav {
      flex: 1;
      overflow-y: auto;
      padding: var(--space-3) 0;
    }

    .module-group {
      margin-bottom: var(--space-1);
    }

    .module-header {
      padding: var(--space-2) var(--space-5);
      font-size: var(--text-xs);
      font-weight: var(--weight-bold);
      color: var(--color-text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .lesson-item {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      padding: var(--space-2) var(--space-5);
      cursor: pointer;
      transition: all var(--transition-fast);
      border-left: 3px solid transparent;
      font-size: var(--text-base);
      color: var(--color-text-secondary);
      line-height: var(--leading-normal);
      user-select: none;
    }

    .lesson-item:hover {
      background: var(--color-accent-blue-light);
      color: var(--color-text-primary);
    }

    .lesson-item.active {
      background: var(--color-accent-blue-light);
      border-left-color: var(--color-action-blue);
      color: var(--color-action-blue);
      font-weight: var(--weight-medium);
    }

    .lesson-item.completed .lesson-check {
      color: var(--color-success);
    }

    .lesson-item.completed .lesson-title-text {
      color: var(--color-text-tertiary);
    }

    .lesson-check {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lesson-check svg {
      width: 16px;
      height: 16px;
    }

    .lesson-check-empty {
      width: 16px;
      height: 16px;
      border: 2px solid var(--color-border);
      border-radius: 50%;
      transition: border-color var(--transition-fast);
    }

    .lesson-item:hover .lesson-check-empty {
      border-color: var(--color-action-blue);
    }

    .lesson-item.active .lesson-check-empty {
      border-color: var(--color-action-blue);
      background: var(--color-accent-blue);
    }

    .lesson-info {
      flex: 1;
      min-width: 0;
    }

    .lesson-title-text {
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: var(--text-xs);
      line-height: var(--leading-snug);
    }

    .lesson-meta {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      margin-top: 2px;
    }

    .lesson-meta-duration {
      font-size: 10px;
      color: var(--color-text-tertiary);
    }

    .lesson-type-icon {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
      color: var(--color-text-tertiary);
    }

    .lesson-type-icon svg {
      width: 14px;
      height: 14px;
    }

    /* ---- Downloads section ---- */
    .downloads-section {
      border-top: 1px solid var(--color-border-light);
      padding: var(--space-4) var(--space-5);
    }

    .downloads-title {
      font-size: 11px;
      font-weight: var(--weight-bold);
      color: var(--color-text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: var(--space-3);
    }

    .download-item {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      padding: var(--space-2) 0;
      font-size: var(--text-xs);
      color: var(--color-action-blue);
      text-decoration: none;
      transition: all var(--transition-fast);
      cursor: pointer;
    }

    .download-item:hover {
      color: var(--color-action-blue-hover);
      transform: translateX(2px);
    }

    .download-item svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }

    .download-item span {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .external-icon {
      width: 12px;
      height: 12px;
      flex-shrink: 0;
      opacity: 0.6;
    }

    /* ---- Main content area ---- */
    .course-main {
      flex: 1;
      padding: var(--space-8);
      max-width: 900px;
      min-width: 0;
    }

    /* ---- Lesson header ---- */
    .lesson-header {
      margin-bottom: var(--space-6);
    }

    .lesson-header h1 {
      font-size: var(--text-2xl);
      font-weight: var(--weight-bold);
      margin-bottom: var(--space-3);
      line-height: var(--leading-snug);
    }

    .lesson-header-meta {
      display: flex;
      align-items: center;
      gap: var(--space-3);
    }

    .lesson-type-badge {
      display: inline-flex;
      align-items: center;
      gap: var(--space-1);
      padding: 3px 10px;
      font-size: 11px;
      font-weight: var(--weight-semibold);
      border-radius: var(--radius-full);
      line-height: 1.4;
    }

    .lesson-type-badge svg {
      width: 12px;
      height: 12px;
    }

    .badge-video {
      background: var(--color-info-bg);
      color: var(--color-info);
    }

    .badge-article {
      background: var(--color-warning-bg);
      color: var(--color-warning);
    }

    .badge-quiz {
      background: rgba(139, 92, 246, 0.12);
      color: #8B5CF6;
    }

    [data-theme="dark"] .badge-quiz {
      background: rgba(167, 139, 250, 0.15);
      color: #A78BFA;
    }

    .lesson-duration {
      font-size: var(--text-xs);
      color: var(--color-text-tertiary);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .lesson-duration svg {
      width: 14px;
      height: 14px;
    }

    /* ---- Video embed ---- */
    .video-container {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 */
      border-radius: var(--radius-lg);
      overflow: hidden;
      background: var(--color-surface-raised);
      margin-bottom: var(--space-6);
      box-shadow: var(--shadow-md);
    }

    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* ---- Article Body ---- */
    .article-body {
      font-size: var(--text-md);
      color: var(--color-text-primary);
      line-height: 1.8;
      margin-bottom: var(--space-6);
    }

    .article-body h2 {
      font-size: var(--text-xl);
      font-weight: var(--weight-bold);
      margin: var(--space-8) 0 var(--space-4);
      color: var(--color-text-primary);
    }

    .article-body h3 {
      font-size: var(--text-lg);
      font-weight: var(--weight-semibold);
      margin: var(--space-6) 0 var(--space-3);
      color: var(--color-text-primary);
    }

    .article-body p {
      margin-bottom: var(--space-4);
      max-width: none;
      color: var(--color-text-secondary);
    }

    .article-body ul, .article-body ol {
      margin: var(--space-3) 0 var(--space-5);
      padding-left: var(--space-6);
    }

    .article-body li {
      margin-bottom: var(--space-2);
      color: var(--color-text-secondary);
    }

    .article-body strong {
      color: var(--color-text-primary);
      font-weight: var(--weight-semibold);
    }

    .article-body blockquote {
      border-left: 3px solid var(--color-action-blue);
      padding: var(--space-3) var(--space-5);
      margin: var(--space-4) 0;
      background: var(--color-accent-blue-light);
      border-radius: 0 var(--radius-md) var(--radius-md) 0;
      font-style: italic;
      color: var(--color-text-secondary);
    }

    .article-body code {
      background: var(--color-bg);
      padding: 2px 6px;
      border-radius: var(--radius-sm);
      font-family: var(--font-mono);
      font-size: 0.9em;
    }

    /* ---- Lesson body ---- */
    .lesson-summary {
      font-size: var(--text-base);
      color: var(--color-text-secondary);
      line-height: var(--leading-relaxed);
      margin-bottom: var(--space-5);
      max-width: none;
    }

    .lesson-source {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      font-size: var(--text-xs);
      color: var(--color-text-tertiary);
      margin-bottom: var(--space-6);
    }

    .lesson-source a {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .lesson-source a svg {
      width: 12px;
      height: 12px;
    }

    .lesson-actions {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      padding-top: var(--space-4);
      border-top: 1px solid var(--color-border-light);
    }

    .btn-complete {
      gap: var(--space-2);
    }

    .btn-complete svg {
      width: 16px;
      height: 16px;
    }

    .btn-complete.completed {
      background: var(--color-success-bg);
      color: var(--color-success);
      border-color: transparent;
      pointer-events: none;
      box-shadow: none;
    }

    .btn-read-article {
      gap: var(--space-2);
    }

    .btn-read-article svg {
      width: 14px;
      height: 14px;
    }

    /* ---- Quiz styles ---- */
    .quiz-container {
      margin-bottom: var(--space-6);
    }

    .quiz-instructions {
      font-size: var(--text-sm);
      color: var(--color-text-secondary);
      margin-bottom: var(--space-6);
      padding: var(--space-4);
      background: var(--color-accent-blue-light);
      border-radius: var(--radius-md);
      border-left: 3px solid var(--color-action-blue);
    }

    .quiz-progress-text {
      font-size: var(--text-xs);
      color: var(--color-text-tertiary);
      font-weight: var(--weight-medium);
      margin-bottom: var(--space-4);
    }

    .quiz-question {
      margin-bottom: var(--space-5);
    }

    .quiz-question-text {
      font-size: var(--text-md);
      font-weight: var(--weight-semibold);
      color: var(--color-text-primary);
      margin-bottom: var(--space-4);
      line-height: var(--leading-normal);
    }

    .quiz-choices {
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
      margin-bottom: var(--space-4);
    }

    .quiz-choice {
      display: flex;
      align-items: flex-start;
      gap: var(--space-3);
      padding: var(--space-3) var(--space-4);
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all var(--transition-fast);
      font-size: var(--text-sm);
      color: var(--color-text-secondary);
      line-height: var(--leading-normal);
    }

    .quiz-choice:hover {
      border-color: var(--color-action-blue);
      background: var(--color-accent-blue-light);
    }

    .quiz-choice.selected {
      border-color: var(--color-action-blue);
      background: var(--color-accent-blue-light);
      color: var(--color-action-blue);
      font-weight: var(--weight-medium);
    }

    .quiz-choice.disabled {
      pointer-events: none;
    }

    .quiz-choice.correct-answer {
      border-color: var(--color-success);
      background: var(--color-success-bg);
      color: var(--color-success);
    }

    .quiz-choice.wrong-answer {
      border-color: var(--color-error);
      background: var(--color-error-bg);
      color: var(--color-error);
    }

    .quiz-radio {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      margin-top: 1px;
      accent-color: var(--color-action-blue);
    }

    /* ---- Quiz feedback ---- */
    .quiz-feedback {
      padding: var(--space-4);
      border-radius: var(--radius-md);
      margin-bottom: var(--space-4);
      animation: fadeInUp 0.3s var(--ease-out) both;
    }

    .quiz-feedback.correct {
      background: var(--color-success-bg);
      border: 1px solid var(--color-success);
    }

    .quiz-feedback.incorrect {
      background: var(--color-error-bg);
      border: 1px solid var(--color-error);
    }

    .quiz-feedback-title {
      font-size: var(--text-sm);
      font-weight: var(--weight-bold);
      margin-bottom: var(--space-2);
    }

    .quiz-feedback.correct .quiz-feedback-title {
      color: var(--color-success);
    }

    .quiz-feedback.incorrect .quiz-feedback-title {
      color: var(--color-error);
    }

    .quiz-feedback-correct-answer {
      font-size: var(--text-xs);
      color: var(--color-text-secondary);
      margin-bottom: var(--space-2);
      font-weight: var(--weight-medium);
    }

    .quiz-feedback-explanation {
      font-size: var(--text-xs);
      color: var(--color-text-secondary);
      line-height: var(--leading-relaxed);
      margin-bottom: var(--space-2);
    }

    .quiz-feedback-source {
      font-size: 11px;
      color: var(--color-text-tertiary);
      font-style: italic;
    }

    /* ---- Quiz summary ---- */
    .quiz-summary {
      text-align: center;
      padding: var(--space-8) var(--space-6);
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      margin-bottom: var(--space-6);
      animation: fadeInUp 0.4s var(--ease-out) both;
    }

    .quiz-summary-score {
      font-size: var(--text-4xl);
      font-weight: var(--weight-extrabold);
      color: var(--color-action-blue);
      margin-bottom: var(--space-2);
    }

    .quiz-summary-label {
      font-size: var(--text-sm);
      color: var(--color-text-secondary);
      margin-bottom: var(--space-4);
    }

    .quiz-summary-message {
      font-size: var(--text-md);
      font-weight: var(--weight-semibold);
      color: var(--color-text-primary);
      margin-bottom: var(--space-6);
    }

    /* ---- Empty / loading states ---- */
    .course-loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-16);
      color: var(--color-text-tertiary);
      font-size: var(--text-sm);
      flex: 1;
    }

    .course-loading .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid var(--color-border);
      border-top-color: var(--color-action-blue);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin-right: var(--space-3);
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .course-not-found {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--space-16);
      text-align: center;
      flex: 1;
    }

    .course-not-found svg {
      width: 48px;
      height: 48px;
      color: var(--color-text-tertiary);
      margin-bottom: var(--space-4);
    }

    .course-not-found h2 {
      font-size: var(--text-xl);
      margin-bottom: var(--space-2);
    }

    .course-not-found p {
      color: var(--color-text-tertiary);
      margin-bottom: var(--space-6);
    }

    /* ---- Lesson transition ---- */
    .lesson-content {
      animation: fadeInUp 0.35s var(--ease-out) both;
    }

    /* ---- Mobile sidebar toggle ---- */
    .course-sidebar-mobile-toggle {
      display: none;
      align-items: center;
      gap: var(--space-2);
      padding: var(--space-3) var(--space-4);
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      font-size: var(--text-sm);
      font-weight: var(--weight-medium);
      color: var(--color-text-primary);
      cursor: pointer;
      margin-bottom: var(--space-4);
      width: 100%;
      font-family: var(--font-family);
      transition: all var(--transition-fast);
    }

    .course-sidebar-mobile-toggle:hover {
      border-color: var(--color-action-blue);
    }

    .course-sidebar-mobile-toggle svg {
      width: 16px;
      height: 16px;
      transition: transform var(--transition-fast);
    }

    .course-sidebar-mobile-toggle.open svg {
      transform: rotate(180deg);
    }

    .course-sidebar-mobile-toggle .toggle-progress {
      margin-left: auto;
      font-size: 11px;
      color: var(--color-action-blue);
      font-weight: var(--weight-semibold);
    }

    /* ---- Responsive ---- */
    @media (max-width: 768px) {
      .course-detail-layout {
        flex-direction: column;
      }

      .course-sidebar {
        width: 100%;
        min-width: 100%;
        max-height: none;
        position: relative;
        top: 0;
        border-right: none;
        border-bottom: 1px solid var(--color-border);
        display: none;
      }

      .course-sidebar.mobile-open {
        display: flex;
        max-height: 60vh;
        overflow-y: auto;
      }

      .course-sidebar-mobile-toggle {
        display: flex;
      }

      .course-main {
        padding: var(--space-4);
      }

      .lesson-header h1 {
        font-size: var(--text-xl);
      }

      .quiz-choice {
        padding: var(--space-2) var(--space-3);
      }
    }

    @media (max-width: 480px) {
      .lesson-header-meta {
        flex-wrap: wrap;
      }
    }
  </style>
</head>
<body>
  <div id="sidebar-container"></div>
  <div id="topbar-container"></div>

  <div class="page-layout">
    <main class="page-content" role="main" style="padding: 0;">

      <!-- Loading state -->
      <div class="course-loading" id="course-loading">
        <div class="spinner"></div>
        Loading course...
      </div>

      <!-- Not found state -->
      <div class="course-not-found" id="course-not-found" style="display: none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <h2>Course Not Found</h2>
        <p>The course you are looking for does not exist or is not available.</p>
        <a href="courses.html" class="btn btn-primary">Browse Courses</a>
      </div>

      <!-- Main course layout -->
      <div class="course-detail-layout" id="course-detail-layout" style="display: none;">

        <!-- Course sidebar (lessons list) -->
        <aside class="course-sidebar" id="course-sidebar">
          <div class="course-sidebar-header">
            <div class="course-sidebar-title" id="sidebar-course-title"></div>
            <div class="course-sidebar-progress-label">
              <span>Overall Progress</span>
              <strong id="sidebar-progress-pct">0%</strong>
            </div>
            <div class="progress-bar progress-bar-sm">
              <div class="progress-bar-fill" id="sidebar-progress-bar" style="width: 0%;" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" aria-label="Course progress: 0%"></div>
            </div>
          </div>

          <nav class="module-nav" id="module-nav" aria-label="Course lessons">
            <!-- Populated by JS -->
          </nav>

          <div class="downloads-section" id="downloads-section">
            <!-- Populated by JS -->
          </div>
        </aside>

        <!-- Main lesson content -->
        <div class="course-main" id="course-main">
          <button class="course-sidebar-mobile-toggle" id="mobile-sidebar-toggle" aria-expanded="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
            <span>Lesson List</span>
            <span class="toggle-progress" id="mobile-progress-pct">0%</span>
          </button>
          <div id="lesson-content">
            <!-- Populated by JS -->
          </div>
        </div>

      </div>

    </main>
  </div>

  <!-- Scripts -->
  <script src="../js/api.js"></script>
  <script src="../js/shared.js"></script>
  <script src="../js/course-data.js"></script>
  <script>
    // Render app shell
    document.getElementById('sidebar-container').innerHTML = renderSidebar();
    document.getElementById('topbar-container').innerHTML = renderTopbar('Course');
    initSidebar();

    /* ============================================================
       State
       ============================================================ */
    let courseSlug = null;
    let courseData = null;
    let completedLessons = new Set();
    let activeLessonId = null;

    // Quiz state
    let quizCurrentIndex = 0;
    let quizScore = 0;
    let quizSelectedAnswer = null;
    let quizAnswered = false;
    let quizQuestions = [];

    /* ============================================================
       Init
       ============================================================ */
    (async function init() {
      const user = await requireLogin();
      if (!user) return;

      // Parse course slug from URL
      const params = new URLSearchParams(window.location.search);
      courseSlug = params.get('course');

      if (!courseSlug || !COURSE_DATA[courseSlug]) {
        document.getElementById('course-loading').style.display = 'none';
        document.getElementById('course-not-found').style.display = 'flex';
        document.title = 'Course Not Found — MindShift';
        return;
      }

      courseData = COURSE_DATA[courseSlug];
      document.title = courseData.title + ' — MindShift';

      // Auto-enroll if not already enrolled
      await API.enroll(courseSlug);

      // Fetch completed lessons from API
      const res = await API.getCompletedLessons(courseSlug);
      if (res && Array.isArray(res.completedLessons)) {
        res.completedLessons.forEach(id => completedLessons.add(id));
      } else if (res && Array.isArray(res)) {
        res.forEach(id => completedLessons.add(id));
      }

      // Render everything
      renderSidebarContent();
      renderDownloads();
      updateProgress();

      // Load first uncompleted lesson, or the first lesson
      const firstUncompleted = getAllLessons().find(l => !completedLessons.has(l.id));
      const startLesson = firstUncompleted || getAllLessons()[0];
      if (startLesson) {
        loadLesson(startLesson.id);
      }

      // Show the layout
      document.getElementById('course-loading').style.display = 'none';
      document.getElementById('course-detail-layout').style.display = 'flex';

      // Mobile sidebar toggle
      const mobileToggle = document.getElementById('mobile-sidebar-toggle');
      const courseSidebar = document.getElementById('course-sidebar');
      mobileToggle.addEventListener('click', () => {
        courseSidebar.classList.toggle('mobile-open');
        mobileToggle.classList.toggle('open');
        const expanded = courseSidebar.classList.contains('mobile-open');
        mobileToggle.setAttribute('aria-expanded', expanded);
      });
    })();

    /* ============================================================
       Helpers
       ============================================================ */
    function getAllLessons() {
      const lessons = [];
      courseData.modules.forEach(mod => {
        mod.lessons.forEach(l => lessons.push(l));
      });
      return lessons;
    }

    function findLesson(lessonId) {
      for (const mod of courseData.modules) {
        for (const l of mod.lessons) {
          if (l.id === lessonId) return l;
        }
      }
      return null;
    }

    function extractYouTubeId(url) {
      if (!url) return null;
      const match = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|v\/))([^?&/#]+)/);
      return match ? match[1] : null;
    }

    function typeIcon(type) {
      if (type === 'video') {
        return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>';
      } else if (type === 'article') {
        return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>';
      } else if (type === 'quiz') {
        return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>';
      }
      return '';
    }

    function externalLinkIcon() {
      return '<svg class="external-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';
    }

    /* ============================================================
       Render sidebar lesson list
       ============================================================ */
    function renderSidebarContent() {
      document.getElementById('sidebar-course-title').textContent = courseData.title;

      const nav = document.getElementById('module-nav');
      let html = '';

      courseData.modules.forEach(mod => {
        html += `<div class="module-group">`;
        html += `<div class="module-header">${mod.title}</div>`;

        mod.lessons.forEach(lesson => {
          const isCompleted = completedLessons.has(lesson.id);
          const isActive = lesson.id === activeLessonId;
          let classes = 'lesson-item';
          if (isCompleted) classes += ' completed';
          if (isActive) classes += ' active';

          const checkHtml = isCompleted
            ? `<div class="lesson-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>`
            : `<div class="lesson-check"><div class="lesson-check-empty"></div></div>`;

          html += `
            <div class="${classes}" data-lesson-id="${lesson.id}" onclick="loadLesson('${lesson.id}')">
              ${checkHtml}
              <div class="lesson-info">
                <span class="lesson-title-text">${lesson.title}</span>
                <div class="lesson-meta">
                  <span class="lesson-type-icon">${typeIcon(lesson.type)}</span>
                  <span class="lesson-meta-duration">${lesson.duration}</span>
                </div>
              </div>
            </div>`;
        });

        html += `</div>`;
      });

      nav.innerHTML = html;
    }

    /* ============================================================
       Render downloads
       ============================================================ */
    function renderDownloads() {
      const section = document.getElementById('downloads-section');
      if (!courseData.downloads || courseData.downloads.length === 0) {
        section.style.display = 'none';
        return;
      }

      let html = '<div class="downloads-title">Downloads</div>';
      courseData.downloads.forEach(dl => {
        html += `
          <a class="download-item" href="${dl.url}" target="_blank" rel="noopener noreferrer">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            <span>${dl.title}</span>
            ${externalLinkIcon()}
          </a>`;
      });

      section.innerHTML = html;
    }

    /* ============================================================
       Update progress bar
       ============================================================ */
    function updateProgress() {
      const allLessons = getAllLessons();
      const total = allLessons.length;
      const done = allLessons.filter(l => completedLessons.has(l.id)).length;
      const pct = total > 0 ? Math.round((done / total) * 100) : 0;

      document.getElementById('sidebar-progress-pct').textContent = pct + '%';
      document.getElementById('mobile-progress-pct').textContent = pct + '%';

      const bar = document.getElementById('sidebar-progress-bar');
      bar.style.width = pct + '%';
      bar.setAttribute('aria-valuenow', pct);
      bar.setAttribute('aria-label', 'Course progress: ' + pct + '%');

      return pct;
    }

    /* ============================================================
       Load a lesson into main content
       ============================================================ */
    function loadLesson(lessonId) {
      const lesson = findLesson(lessonId);
      if (!lesson) return;

      activeLessonId = lessonId;

      // Update sidebar active state
      document.querySelectorAll('.lesson-item').forEach(el => {
        el.classList.toggle('active', el.dataset.lessonId === lessonId);
      });

      // Close mobile sidebar
      const courseSidebar = document.getElementById('course-sidebar');
      const mobileToggle = document.getElementById('mobile-sidebar-toggle');
      if (courseSidebar.classList.contains('mobile-open')) {
        courseSidebar.classList.remove('mobile-open');
        mobileToggle.classList.remove('open');
        mobileToggle.setAttribute('aria-expanded', 'false');
      }

      // Render lesson content
      const container = document.getElementById('lesson-content');

      if (lesson.type === 'video') {
        container.innerHTML = renderVideoLesson(lesson);
      } else if (lesson.type === 'article') {
        container.innerHTML = renderArticleLesson(lesson);
      } else if (lesson.type === 'quiz') {
        quizCurrentIndex = 0;
        quizScore = 0;
        quizSelectedAnswer = null;
        quizAnswered = false;
        // Unit quizzes have questions on the lesson; mastery quiz uses courseData.quiz
        quizQuestions = lesson.questions || (lesson.id === 'quiz' && courseData.quiz ? courseData.quiz.questions : []);
        container.innerHTML = renderQuizLesson(lesson);
      }

      // Scroll main to top
      document.getElementById('course-main').scrollTo({ top: 0, behavior: 'smooth' });
    }

    /* ============================================================
       Render video lesson
       ============================================================ */
    function renderLessonActions(lessonId, isCompleted) {
      if (isCompleted) {
        return `<div class="lesson-actions" style="display:flex;gap:var(--space-3);flex-wrap:wrap;">
          <button class="btn btn-secondary btn-complete completed" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
            Completed
          </button>
          <button class="btn btn-ghost btn-sm" onclick="undoComplete('${lessonId}')" style="color:var(--color-text-tertiary);">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/></svg>
            Undo
          </button>
        </div>`;
      }
      return `<div class="lesson-actions">
        <button class="btn btn-primary btn-complete" id="btn-mark-complete" onclick="markComplete('${lessonId}')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          Mark as Complete
        </button>
      </div>`;
    }

    function renderVideoLesson(lesson) {
      const videoUrl = lesson.videoUrl || (lesson.source ? lesson.source.url : '');
      const videoId = extractYouTubeId(videoUrl);
      const embedUrl = videoId ? `https://www.youtube.com/embed/${videoId}` : '';
      const isCompleted = completedLessons.has(lesson.id);

      return `
        <div class="lesson-content">
          <div class="lesson-header">
            <h1>${lesson.title}</h1>
            <div class="lesson-header-meta">
              <span class="lesson-type-badge badge-video">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                Video
              </span>
              <span class="lesson-duration">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                ${lesson.duration}
              </span>
            </div>
          </div>

          ${embedUrl ? `
          <div class="video-container">
            <iframe src="${embedUrl}" title="${lesson.title}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen loading="lazy"></iframe>
          </div>` : ''}

          <p class="lesson-summary">${lesson.summary}</p>

          ${lesson.source ? `
          <div class="lesson-source">
            Source:
            <a href="${lesson.source.url}" target="_blank" rel="noopener noreferrer">
              ${lesson.source.title}
              ${externalLinkIcon()}
            </a>
          </div>` : ''}

          ${renderLessonActions(lesson.id, isCompleted)}
        </div>`;
    }

    /* ============================================================
       Render article lesson
       ============================================================ */
    function renderArticleLesson(lesson) {
      const isCompleted = completedLessons.has(lesson.id);
      const articleUrl = lesson.articleUrl || (lesson.source ? lesson.source.url : '');

      return `
        <div class="lesson-content">
          <div class="lesson-header">
            <h1>${lesson.title}</h1>
            <div class="lesson-header-meta">
              <span class="lesson-type-badge badge-article">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                Article
              </span>
              <span class="lesson-duration">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                ${lesson.duration}
              </span>
            </div>
          </div>

          <div class="article-body">
            ${lesson.content || '<p>' + lesson.summary + '</p>'}
          </div>

          ${articleUrl ? `
          <div class="lesson-source" style="margin-top: var(--space-6); padding-top: var(--space-4); border-top: 1px solid var(--color-border-light);">
            <span style="color: var(--color-text-tertiary); font-size: var(--text-sm);">Original source:</span>
            <a href="${articleUrl}" target="_blank" rel="noopener noreferrer">
              ${lesson.source ? lesson.source.title : 'Read original article'}
              ${externalLinkIcon()}
            </a>
          </div>` : ''}

          ${renderLessonActions(lesson.id, isCompleted)}
        </div>`;
    }

    /* ============================================================
       Render quiz lesson
       ============================================================ */
    function renderQuizLesson(lesson) {
      const totalQ = quizQuestions.length;

      return `
        <div class="lesson-content">
          <div class="lesson-header">
            <h1>${lesson.title}</h1>
            <div class="lesson-header-meta">
              <span class="lesson-type-badge badge-quiz">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                Quiz
              </span>
              <span class="lesson-duration">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                ${lesson.duration}
              </span>
            </div>
          </div>

          <div class="quiz-instructions">
            ${totalQ} questions. Answer all to complete. This quiz is about learning, not gatekeeping — you can complete it regardless of your score.
          </div>

          <div class="quiz-container" id="quiz-container">
            ${renderQuizQuestion()}
          </div>
        </div>`;
    }

    /* ============================================================
       Render a single quiz question
       ============================================================ */
    function renderQuizQuestion() {
      if (quizCurrentIndex >= quizQuestions.length) {
        return renderQuizSummary();
      }

      const q = quizQuestions[quizCurrentIndex];
      const totalQ = quizQuestions.length;

      let html = `
        <div class="quiz-progress-text">Question ${quizCurrentIndex + 1} of ${totalQ}</div>
        <div class="quiz-question">
          <div class="quiz-question-text">${q.question}</div>
          <div class="quiz-choices" id="quiz-choices">`;

      q.choices.forEach((choice, idx) => {
        html += `
            <label class="quiz-choice" data-choice-idx="${idx}" onclick="selectQuizChoice(${idx})">
              <input type="radio" name="quiz-answer" value="${idx}" class="quiz-radio">
              <span>${choice}</span>
            </label>`;
      });

      html += `
          </div>
        </div>
        <div id="quiz-feedback-area"></div>
        <div id="quiz-actions">
          <button class="btn btn-primary" id="btn-submit-answer" onclick="submitQuizAnswer()" disabled>Submit Answer</button>
        </div>`;

      return html;
    }

    /* ============================================================
       Quiz: select a choice
       ============================================================ */
    function selectQuizChoice(idx) {
      if (quizAnswered) return;

      quizSelectedAnswer = idx;

      document.querySelectorAll('.quiz-choice').forEach((el, i) => {
        el.classList.toggle('selected', i === idx);
        el.querySelector('input').checked = (i === idx);
      });

      document.getElementById('btn-submit-answer').disabled = false;
    }

    /* ============================================================
       Quiz: submit answer
       ============================================================ */
    function submitQuizAnswer() {
      if (quizSelectedAnswer === null || quizAnswered) return;

      quizAnswered = true;
      const q = quizQuestions[quizCurrentIndex];
      const isCorrect = quizSelectedAnswer === q.correct;
      if (isCorrect) quizScore++;

      // Disable all choices
      document.querySelectorAll('.quiz-choice').forEach((el, i) => {
        el.classList.add('disabled');
        if (i === q.correct) {
          el.classList.add('correct-answer');
        }
        if (i === quizSelectedAnswer && !isCorrect) {
          el.classList.add('wrong-answer');
        }
      });

      // Show feedback
      const feedbackArea = document.getElementById('quiz-feedback-area');
      feedbackArea.innerHTML = `
        <div class="quiz-feedback ${isCorrect ? 'correct' : 'incorrect'}">
          <div class="quiz-feedback-title">${isCorrect ? 'Correct!' : 'Incorrect'}</div>
          ${!isCorrect ? `<div class="quiz-feedback-correct-answer">Correct answer: ${q.choices[q.correct]}</div>` : ''}
          <div class="quiz-feedback-explanation">${q.explanation}</div>
          <div class="quiz-feedback-source">${q.source}</div>
        </div>`;

      // Replace submit button with next
      const actionsArea = document.getElementById('quiz-actions');
      const isLast = quizCurrentIndex >= quizQuestions.length - 1;

      if (isLast) {
        actionsArea.innerHTML = `
          <button class="btn btn-primary" onclick="showQuizSummary()">
            See Results
          </button>`;
      } else {
        actionsArea.innerHTML = `
          <button class="btn btn-primary" onclick="nextQuizQuestion()">
            Next Question
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><polyline points="9 18 15 12 9 6"/></svg>
          </button>`;
      }
    }

    /* ============================================================
       Quiz: next question
       ============================================================ */
    function nextQuizQuestion() {
      quizCurrentIndex++;
      quizSelectedAnswer = null;
      quizAnswered = false;

      const container = document.getElementById('quiz-container');
      container.innerHTML = renderQuizQuestion();
    }

    /* ============================================================
       Quiz: show summary
       ============================================================ */
    function showQuizSummary() {
      quizCurrentIndex = quizQuestions.length;
      const container = document.getElementById('quiz-container');
      container.innerHTML = renderQuizSummary();
    }

    function renderQuizSummary() {
      const totalQ = quizQuestions.length;
      const pct = Math.round((quizScore / totalQ) * 100);
      const isCompleted = completedLessons.has(activeLessonId);
      let message = '';

      if (pct === 100) {
        message = 'Perfect score! Outstanding work!';
      } else if (pct >= 75) {
        message = 'Great job! You have a solid understanding.';
      } else if (pct >= 50) {
        message = 'Good effort! Consider reviewing the material.';
      } else {
        message = 'Keep learning! Review the course material and try again.';
      }

      return `
        <div class="quiz-summary">
          <div class="quiz-summary-score">${quizScore}/${totalQ}</div>
          <div class="quiz-summary-label">${pct}% correct</div>
          <div class="quiz-summary-message">${message}</div>
          <div style="display:flex; gap:var(--space-3); justify-content:center; flex-wrap:wrap;">
            <button class="btn ${isCompleted ? 'btn-secondary btn-complete completed' : 'btn-primary btn-complete'}" onclick="markComplete('${activeLessonId}')" ${isCompleted ? 'disabled' : ''}>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
              ${isCompleted ? 'Completed' : 'Complete Quiz'}
            </button>
            ${isCompleted ? `
            <button class="btn btn-ghost btn-sm" onclick="undoComplete('${activeLessonId}')" style="color:var(--color-text-tertiary);">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/></svg>
              Undo
            </button>` : ''}
            <button class="btn btn-secondary" onclick="retakeQuiz()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/></svg>
              Retake Quiz
            </button>
          </div>
        </div>`;
    }

    /* ============================================================
       Retake quiz
       ============================================================ */
    async function undoComplete(lessonId) {
      var res = await API.uncompleteLesson(courseSlug, lessonId);
      if (res && !res.error) {
        completedLessons.delete(lessonId);
        renderSidebarContent();
        loadLesson(lessonId);
        updateProgress();
        showToast('Lesson marked as incomplete.');
      } else {
        showToast('Failed to undo completion.');
      }
    }

    function retakeQuiz() {
      quizCurrentIndex = 0;
      quizScore = 0;
      quizSelectedAnswer = null;
      quizAnswered = false;
      const container = document.getElementById('quiz-container');
      container.innerHTML = renderQuizQuestion();
      document.getElementById('course-main').scrollTo({ top: 0, behavior: 'smooth' });
    }

    /* ============================================================
       Mark lesson as complete (API call)
       ============================================================ */
    async function markComplete(lessonId) {
      if (completedLessons.has(lessonId)) return;

      const btn = document.getElementById('btn-mark-complete');
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = `
          <div class="spinner" style="width:14px;height:14px;border-width:2px;margin:0;"></div>
          Saving...`;
      }

      const res = await API.completeLesson(courseSlug, lessonId);

      if (res.error) {
        showToast('Failed to save progress. Please try again.');
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = `
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
            Mark as Complete`;
        }
        return;
      }

      // Update local state
      completedLessons.add(lessonId);

      // Show XP toast
      if (res.xpEarned) {
        showToast(`+${res.xpEarned} XP earned!`);
      } else {
        showToast('Lesson completed!');
      }

      // Show achievement toasts
      if (res.newAchievements && Array.isArray(res.newAchievements)) {
        res.newAchievements.forEach((ach, i) => {
          setTimeout(() => {
            showToast(ach.title ? `Achievement unlocked: ${ach.title} (+${ach.xp || 0} XP)` : `New achievement! +${ach.xp || 0} XP`);
          }, (i + 1) * 1500);
        });
      }

      // Update button state
      if (btn) {
        btn.classList.remove('btn-primary');
        btn.classList.add('btn-secondary', 'completed');
        btn.disabled = true;
        btn.style.boxShadow = 'none';
        btn.innerHTML = `
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          Completed`;
      }

      // For quiz summary button (no id), update via class
      document.querySelectorAll('.quiz-summary .btn-complete').forEach(b => {
        if (!b.id) {
          b.classList.remove('btn-primary');
          b.classList.add('btn-secondary', 'completed');
          b.disabled = true;
          b.style.boxShadow = 'none';
          b.innerHTML = `
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
            Completed`;
        }
      });

      // Update sidebar checkmarks
      renderSidebarContent();

      // Update progress
      const pct = updateProgress();

      // Check if all lessons are complete
      const allLessons = getAllLessons();
      const allDone = allLessons.every(l => completedLessons.has(l.id));

      if (allDone) {
        await API.updateCourseProgress(courseSlug, 100, courseData.modules.length, 'completed');
        showToast('Course completed! Congratulations!');
      } else {
        // Update course progress
        const currentModuleIdx = courseData.modules.findIndex(mod =>
          mod.lessons.some(l => !completedLessons.has(l.id))
        );
        await API.updateCourseProgress(courseSlug, pct, currentModuleIdx + 1, 'active');
      }
    }
  </script>
</body>
</html>
