<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leaderboard — MindShift</title>
  <meta name="description" content="See how you rank among fellow learners. View top performers and connect with friends on MindShift.">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Design System -->
  <link rel="stylesheet" href="../css/design-system.css">

  <!-- Page-specific styles -->
  <style>
    /* ── Your Ranking Card ── */
    .your-rank-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-left: 4px solid var(--color-action-blue);
      border-radius: var(--radius-lg);
      padding: var(--space-6);
      margin-bottom: var(--space-8);
      display: flex;
      align-items: center;
      gap: var(--space-6);
      transition: box-shadow var(--transition-base), transform var(--transition-base);
    }

    .your-rank-card:hover {
      box-shadow: var(--shadow-lg);
      transform: translateY(-2px);
    }

    .your-rank-position {
      flex-shrink: 0;
      text-align: center;
      min-width: 56px;
    }

    .your-rank-number {
      font-size: var(--text-3xl);
      font-weight: var(--weight-extrabold);
      color: var(--color-action-blue);
      line-height: 1;
    }

    .your-rank-label {
      font-size: var(--text-xs);
      font-weight: var(--weight-medium);
      color: var(--color-text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-top: var(--space-1);
    }

    .your-rank-divider {
      width: 1px;
      height: 48px;
      background: var(--color-border);
      flex-shrink: 0;
    }

    .your-rank-avatar {
      flex-shrink: 0;
    }

    .your-rank-info {
      flex: 1;
      min-width: 0;
    }

    .your-rank-name {
      font-size: var(--text-lg);
      font-weight: var(--weight-bold);
      color: var(--color-text-primary);
      margin-bottom: var(--space-1);
    }

    .your-rank-level {
      font-size: var(--text-sm);
      color: var(--color-text-secondary);
      margin-bottom: var(--space-2);
    }

    .your-rank-stats {
      display: flex;
      align-items: center;
      gap: var(--space-6);
      flex-wrap: wrap;
    }

    .your-rank-stat {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      font-size: var(--text-sm);
      color: var(--color-text-secondary);
    }

    .your-rank-stat strong {
      font-weight: var(--weight-semibold);
      color: var(--color-text-primary);
    }

    /* ── Leaderboard Table Section ── */
    .leaderboard-section {
      margin-bottom: var(--space-8);
    }

    .leaderboard-table td,
    .leaderboard-table th {
      vertical-align: middle;
    }

    .rank-cell {
      font-weight: var(--weight-semibold);
      color: var(--color-text-primary);
      width: 60px;
    }

    /* Top 3 rank circles */
    .rank-indicator {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      border-radius: var(--radius-full);
      font-size: var(--text-sm);
      font-weight: var(--weight-bold);
    }

    .rank-gold {
      background: rgba(212, 160, 23, 0.14);
      color: #D4A017;
    }

    .rank-silver {
      background: rgba(148, 163, 184, 0.16);
      color: #64748B;
    }

    .rank-bronze {
      background: rgba(205, 127, 50, 0.14);
      color: #CD7F32;
    }

    [data-theme="dark"] .rank-gold {
      background: rgba(212, 160, 23, 0.2);
      color: #E8C547;
    }

    [data-theme="dark"] .rank-silver {
      background: rgba(148, 163, 184, 0.18);
      color: #94A3B8;
    }

    [data-theme="dark"] .rank-bronze {
      background: rgba(205, 127, 50, 0.2);
      color: #E09955;
    }

    .rank-default {
      color: var(--color-text-secondary);
      font-weight: var(--weight-medium);
      padding-left: var(--space-2);
    }

    /* Student cell */
    .student-cell {
      display: flex;
      align-items: center;
      gap: var(--space-3);
    }

    .student-name {
      font-weight: var(--weight-medium);
      color: var(--color-text-primary);
    }

    .student-you {
      font-size: var(--text-xs);
      font-weight: var(--weight-semibold);
      color: var(--color-action-blue);
      margin-left: var(--space-1);
    }

    /* Level badge in table */
    .level-badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      font-size: var(--text-xs);
      font-weight: var(--weight-medium);
      border-radius: var(--radius-full);
      background: var(--color-accent-blue-light);
      color: var(--color-action-blue);
      white-space: nowrap;
    }

    .xp-value {
      font-weight: var(--weight-semibold);
      color: var(--color-text-primary);
    }

    .courses-value {
      color: var(--color-text-secondary);
      font-size: var(--text-sm);
    }

    /* Highlighted user row */
    .leaderboard-table tr.user-row td {
      background: var(--color-accent-blue-light);
      border-bottom-color: rgba(37, 99, 235, 0.1);
    }

    .leaderboard-table tr.user-row:hover td {
      background: var(--color-accent-blue);
    }

    /* Row hover */
    .leaderboard-table tbody tr {
      transition: background-color var(--transition-fast);
    }

    /* ── Friends Section ── */
    .friends-section {
      margin-bottom: var(--space-8);
    }

    .friends-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--space-5);
    }

    .friends-header-left {
      display: flex;
      align-items: center;
      gap: var(--space-3);
    }

    .friends-header-left h2 {
      font-size: var(--text-lg);
      font-weight: var(--weight-bold);
      color: var(--color-text-primary);
    }

    .friends-count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 24px;
      height: 24px;
      padding: 0 var(--space-2);
      font-size: var(--text-xs);
      font-weight: var(--weight-semibold);
      border-radius: var(--radius-full);
      background: var(--color-accent-blue);
      color: var(--color-deep-blue);
    }

    .friends-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--space-5);
    }

    .friend-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: var(--space-5);
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
      transition: box-shadow var(--transition-base), transform var(--transition-base), opacity 0.4s var(--ease-out);
    }

    .friend-card:hover {
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
    }

    .friend-card-top {
      display: flex;
      align-items: center;
      gap: var(--space-3);
    }

    .friend-card-info {
      flex: 1;
      min-width: 0;
    }

    .friend-card-name {
      font-size: var(--text-sm);
      font-weight: var(--weight-semibold);
      color: var(--color-text-primary);
      line-height: var(--leading-tight);
    }

    .friend-card-level {
      font-size: var(--text-xs);
      color: var(--color-text-secondary);
      margin-top: 2px;
    }

    .friend-card-xp {
      font-size: var(--text-xs);
      font-weight: var(--weight-semibold);
      color: var(--color-action-blue);
    }

    .friend-card-activity {
      font-size: var(--text-xs);
      color: var(--color-text-tertiary);
      line-height: var(--leading-normal);
      padding: var(--space-2) var(--space-3);
      background: var(--color-bg);
      border-radius: var(--radius-md);
    }

    .friend-card-actions {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      margin-top: auto;
    }

    .btn-remove {
      background: none;
      border: none;
      cursor: pointer;
      font-family: var(--font-family);
      font-size: var(--text-xs);
      font-weight: var(--weight-medium);
      color: var(--color-text-tertiary);
      padding: var(--space-1) var(--space-2);
      border-radius: var(--radius-sm);
      transition: color var(--transition-fast), background var(--transition-fast);
    }

    .btn-remove:hover {
      color: var(--color-error);
      background: var(--color-error-bg);
    }

    .btn-remove:active {
      transform: scale(0.96);
    }

    /* Friend card fadeOut */
    .friend-card.removing {
      opacity: 0;
      transform: translateY(8px) scale(0.97);
      pointer-events: none;
    }

    /* Empty friends state */
    .friends-empty {
      text-align: center;
      padding: var(--space-10) var(--space-6);
      color: var(--color-text-tertiary);
      background: var(--color-surface);
      border: 1px dashed var(--color-border);
      border-radius: var(--radius-lg);
    }

    .friends-empty svg {
      margin: 0 auto var(--space-3);
      color: var(--color-border);
    }

    .friends-empty p {
      font-size: var(--text-sm);
      margin: 0 auto;
    }

    /* ── Add Friend Modal ── */
    .modal-title {
      font-size: var(--text-lg);
      font-weight: var(--weight-bold);
      color: var(--color-text-primary);
      margin-bottom: var(--space-5);
    }

    .modal-search {
      position: relative;
      margin-bottom: var(--space-5);
    }

    .modal-search svg {
      position: absolute;
      left: var(--space-3);
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      color: var(--color-text-tertiary);
      pointer-events: none;
    }

    .modal-search .input {
      padding-left: var(--space-10);
    }

    .suggested-users {
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
    }

    .suggested-label {
      font-size: var(--text-xs);
      font-weight: var(--weight-semibold);
      color: var(--color-text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .suggested-user {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      padding: var(--space-3);
      border-radius: var(--radius-md);
      transition: background var(--transition-fast);
    }

    .suggested-user:hover {
      background: var(--color-accent-blue-light);
    }

    .suggested-user-info {
      flex: 1;
      min-width: 0;
    }

    .suggested-user-name {
      font-size: var(--text-sm);
      font-weight: var(--weight-medium);
      color: var(--color-text-primary);
    }

    .suggested-user-meta {
      font-size: var(--text-xs);
      color: var(--color-text-tertiary);
    }

    .btn-add-friend {
      flex-shrink: 0;
    }

    .btn-add-friend.sent {
      background: var(--color-success-bg);
      color: var(--color-success);
      border-color: transparent;
      pointer-events: none;
    }

    /* ── Scale-in animation for rank card ── */
    @keyframes rankCardIn {
      from {
        opacity: 0;
        transform: scale(0.96) translateY(8px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .rank-card-animate {
      animation: rankCardIn 0.5s var(--ease-spring) both;
    }

    /* ── Responsive ── */
    @media (max-width: 1024px) {
      .friends-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 768px) {
      .your-rank-card {
        flex-direction: column;
        align-items: flex-start;
        gap: var(--space-4);
      }

      .your-rank-divider {
        width: 100%;
        height: 1px;
      }

      .your-rank-stats {
        gap: var(--space-4);
      }

      .friends-grid {
        grid-template-columns: 1fr;
      }

      .friends-header {
        flex-direction: column;
        align-items: flex-start;
        gap: var(--space-3);
      }

      .leaderboard-table .hide-mobile {
        display: none;
      }
    }

    @media (max-width: 480px) {
      .your-rank-stats {
        flex-direction: column;
        align-items: flex-start;
        gap: var(--space-2);
      }
    }
  </style>
</head>
<body>
  <div id="sidebar-container"></div>
  <div id="topbar-container"></div>

  <div class="page-layout">
    <main class="page-content" role="main">

      <!-- Page Header -->
      <div class="page-header" data-animate>
        <h1>Leaderboard</h1>
        <p>See how you rank among fellow learners</p>
      </div>

      <!-- Your Ranking Card (populated by JS) -->
      <section id="yourRankCard" aria-label="Your ranking"></section>

      <!-- Top 5 Leaderboard -->
      <section class="leaderboard-section" aria-label="Top 5 leaderboard">
        <div class="section-header" data-animate>
          <h2>Top 5</h2>
        </div>
        <div class="table-container">
          <table class="leaderboard-table">
            <thead>
              <tr>
                <th>Rank</th>
                <th>Learner</th>
                <th>Level</th>
                <th>XP</th>
                <th class="hide-mobile">Courses</th>
              </tr>
            </thead>
            <tbody id="leaderboardBody">
              <!-- Populated by JS -->
            </tbody>
          </table>
        </div>
      </section>

      <!-- Friends Section -->
      <section class="friends-section" aria-label="Friends">
        <div class="friends-header">
          <div class="friends-header-left">
            <h2>Friends</h2>
            <span class="friends-count" id="friendsCount">0</span>
          </div>
          <button class="btn btn-primary btn-sm" id="addFriendBtn" aria-haspopup="dialog">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Add Friend
          </button>
        </div>

        <div class="friends-grid" id="friendsGrid">
          <!-- Friend cards rendered by JS -->
        </div>
      </section>

    </main>
  </div>

  <!-- Add Friend Modal -->
  <div class="modal-overlay" id="addFriendModal" role="dialog" aria-modal="true" aria-label="Add a friend">
    <div class="modal" style="position: relative;">
      <button class="modal-close" id="modalCloseBtn" aria-label="Close modal">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
      <h3 class="modal-title">Add Friend</h3>
      <div class="modal-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" class="input" id="friendSearchInput" placeholder="Search by name..." autocomplete="off">
      </div>
      <div class="suggested-users" id="suggestedUsers">
        <span class="suggested-label">Suggested</span>
        <!-- Suggested users rendered by JS -->
      </div>
    </div>
  </div>

  <!-- API client (must load before shared.js) -->
  <script src="../js/api.js"></script>
  <!-- Shared JS -->
  <script src="../js/shared.js"></script>
  <script>
    /* ── Render shell ── */
    document.getElementById('sidebar-container').innerHTML = renderSidebar();
    document.getElementById('topbar-container').innerHTML = renderTopbar('Leaderboard');
    initSidebar();

    /* ── State ── */
    let leaderboardData = [];
    let currentUser = null;
    let friends = [];
    let friendIds = new Set();

    /* ── Helper: get initials from username ── */
    function getInitialsFromUsername(username) {
      if (!username) return '??';
      const parts = username.split(' ');
      if (parts.length >= 2) {
        return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
      }
      return username.slice(0, 2).toUpperCase();
    }

    /* ── Helper: format XP with commas ── */
    function formatXP(xp) {
      return Number(xp).toLocaleString();
    }

    /* ── Render Your Ranking Card ── */
    function renderYourRankCard() {
      const container = document.getElementById('yourRankCard');
      if (!currentUser) {
        container.innerHTML = '';
        return;
      }

      // Find current user's rank among user + friends
      let board = [{ id: currentUser.id, xp: currentUser.xp || 0 }];
      friends.forEach(f => board.push({ id: f.id, xp: f.xp || 0 }));
      board.sort((a, b) => b.xp - a.xp);
      let userRank = board.findIndex(u => u.id === currentUser.id) + 1;

      const initials = getInitialsFromUsername(currentUser.username);
      const levelDisplay = currentUser.level_name
        ? `${currentUser.level_name} (Lvl ${currentUser.level})`
        : `Level ${currentUser.level || 1}`;

      container.innerHTML = `
        <div class="your-rank-card rank-card-animate">
          <div class="your-rank-position">
            <div class="your-rank-number">#${userRank}</div>
            <div class="your-rank-label">Your Rank</div>
          </div>
          <div class="your-rank-divider" aria-hidden="true"></div>
          <div class="your-rank-avatar">
            <div class="avatar avatar-lg" data-user-avatar>${initials}</div>
          </div>
          <div class="your-rank-info">
            <div class="your-rank-name">${currentUser.username}</div>
            <div class="your-rank-level">${levelDisplay}</div>
            <div class="your-rank-stats">
              <span class="your-rank-stat"><strong>${formatXP(currentUser.xp || 0)}</strong> XP</span>
              <span class="your-rank-stat">Streak: <strong>${currentUser.streak_days || 0}</strong> days</span>
            </div>
          </div>
        </div>
      `;
    }

    const MAX_FRIENDS = 4;

    /* ── Render Leaderboard Table (user + friends only, max 5) ── */
    function renderLeaderboard() {
      const tbody = document.getElementById('leaderboardBody');

      // Build board from current user + friends, sorted by XP descending
      let board = [];

      // Add current user
      if (currentUser) {
        board.push({
          id: currentUser.id,
          username: currentUser.username,
          xp: currentUser.xp || 0,
          level: currentUser.level || 1,
          level_name: currentUser.level_name || 'Beginner',
          courses_completed: currentUser.courses_completed || 0,
          isCurrentUser: true
        });
      }

      // Add friends (up to 4)
      friends.slice(0, MAX_FRIENDS).forEach(f => {
        board.push({
          id: f.id,
          username: f.username,
          xp: f.xp || 0,
          level: f.level || 1,
          level_name: f.level_name || 'Beginner',
          courses_completed: f.courses_completed || 0,
          isCurrentUser: false
        });
      });

      // Sort by XP descending
      board.sort((a, b) => b.xp - a.xp);

      if (board.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="5" style="text-align: center; padding: var(--space-8); color: var(--color-text-tertiary);">
              No leaderboard data yet. Add friends to compare progress!
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = board.map((user, i) => {
        const rank = i + 1;
        const initials = getInitialsFromUsername(user.username);
        const levelDisplay = user.level_name
          ? `${user.level_name} (Lvl ${user.level})`
          : `Level ${user.level || 1}`;
        const coursesCount = user.courses_completed || 0;
        const coursesLabel = coursesCount === 1 ? '1 course' : `${coursesCount} courses`;

        let rankHTML;
        if (rank === 1) {
          rankHTML = '<span class="rank-indicator rank-gold">1</span>';
        } else if (rank === 2) {
          rankHTML = '<span class="rank-indicator rank-silver">2</span>';
        } else if (rank === 3) {
          rankHTML = '<span class="rank-indicator rank-bronze">3</span>';
        } else {
          rankHTML = `<span class="rank-default">${rank}</span>`;
        }

        return `
          <tr${user.isCurrentUser ? ' class="user-row"' : ''} data-animate class="animate-in-delay-${rank}">
            <td class="rank-cell">${rankHTML}</td>
            <td>
              <div class="student-cell">
                <div class="avatar avatar-sm"${user.isCurrentUser ? ' data-user-avatar' : ''}>${initials}</div>
                <span class="student-name">${user.username}</span>
                ${user.isCurrentUser ? '<span class="student-you">(you)</span>' : ''}
              </div>
            </td>
            <td><span class="level-badge">${levelDisplay}</span></td>
            <td><span class="xp-value">${formatXP(user.xp || 0)}</span></td>
            <td class="hide-mobile"><span class="courses-value">${coursesLabel}</span></td>
          </tr>
        `;
      }).join('');
    }

    /* ── Render Friends ── */
    function renderFriends() {
      const grid = document.getElementById('friendsGrid');
      const countEl = document.getElementById('friendsCount');
      countEl.textContent = friends.length + '/' + MAX_FRIENDS;

      // Disable/enable Add Friend button based on limit
      const addBtn = document.getElementById('addFriendBtn');
      if (addBtn) {
        if (friends.length >= MAX_FRIENDS) {
          addBtn.disabled = true;
          addBtn.setAttribute('data-tooltip', 'Maximum 4 friends');
        } else {
          addBtn.disabled = false;
          addBtn.removeAttribute('data-tooltip');
        }
      }

      if (friends.length === 0) {
        grid.innerHTML = `
          <div class="friends-empty" style="grid-column: 1 / -1;" data-animate>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="40" height="40">
              <path d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
              <line x1="19" y1="8" x2="19" y2="14"/>
              <line x1="22" y1="11" x2="16" y2="11"/>
            </svg>
            <p>No friends yet. Add friends to compare progress!</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = friends.map((friend, i) => {
        const initials = getInitialsFromUsername(friend.username);
        const levelDisplay = friend.level_name
          ? `${friend.level_name} (Lvl ${friend.level})`
          : `Level ${friend.level || 1}`;

        return `
          <div class="friend-card" data-animate data-friend-id="${friend.id}" style="animation-delay: ${i * 0.08}s;">
            <div class="friend-card-top">
              <div class="avatar">${initials}</div>
              <div class="friend-card-info">
                <div class="friend-card-name">${friend.username}</div>
                <div class="friend-card-level">${levelDisplay} &middot; <span class="friend-card-xp">${formatXP(friend.xp || 0)} XP</span></div>
              </div>
            </div>
            <div class="friend-card-actions">
              <button class="btn btn-ghost btn-sm" onclick="viewProfile('${friend.username}')">View Profile</button>
              <button class="btn-remove" onclick="handleRemoveFriend('${friend.id}', this)" aria-label="Remove ${friend.username}">Remove</button>
            </div>
          </div>
        `;
      }).join('');
    }

    /* ── Remove Friend ── */
    async function handleRemoveFriend(friendId, btn) {
      const card = btn.closest('.friend-card');
      if (!card) return;

      card.classList.add('removing');

      const res = await API.removeFriend(friendId);

      setTimeout(() => {
        if (!res.error) {
          friends = friends.filter(f => String(f.id) !== String(friendId));
          friendIds = new Set(friends.map(f => String(f.id)));
          renderFriends();
          renderLeaderboard();
          renderYourRankCard();
          applyUserProfilePic();
          showToast('Friend removed');
        } else {
          card.classList.remove('removing');
          showToast('Failed to remove friend');
        }
      }, 400);
    }

    /* ── View Profile (placeholder) ── */
    function viewProfile(name) {
      showToast('Viewing ' + name + '\'s profile');
    }

    /* ── Modal ── */
    const modal = document.getElementById('addFriendModal');
    const addFriendBtn = document.getElementById('addFriendBtn');
    const modalCloseBtn = document.getElementById('modalCloseBtn');
    const friendSearchInput = document.getElementById('friendSearchInput');

    function openModal() {
      modal.classList.add('active');
      document.body.style.overflow = 'hidden';
      renderSuggestedUsers();
      setTimeout(() => friendSearchInput.focus(), 100);
    }

    function closeModal() {
      modal.classList.remove('active');
      document.body.style.overflow = '';
      friendSearchInput.value = '';
    }

    addFriendBtn.addEventListener('click', openModal);
    modalCloseBtn.addEventListener('click', closeModal);

    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeModal();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && modal.classList.contains('active')) {
        closeModal();
      }
    });

    /* ── Render Suggested Users (from leaderboard, excluding friends and self) ── */
    function renderSuggestedUsers(filter) {
      const container = document.getElementById('suggestedUsers');
      const query = (filter || '').toLowerCase().trim();

      // Suggest leaderboard users who are not already friends and not the current user
      let suggestions = leaderboardData.filter(u => {
        if (currentUser && u.id === currentUser.id) return false;
        if (friendIds.has(String(u.id))) return false;
        if (query && !u.username.toLowerCase().includes(query)) return false;
        return true;
      });

      let html = '<span class="suggested-label">Suggested</span>';

      if (suggestions.length === 0) {
        html += '<p style="font-size: var(--text-sm); color: var(--color-text-tertiary); padding: var(--space-4) 0;">No users found.</p>';
      } else {
        html += suggestions.map(user => {
          const initials = getInitialsFromUsername(user.username);
          const levelDisplay = user.level_name
            ? `${user.level_name} (Lvl ${user.level})`
            : `Level ${user.level || 1}`;

          return `
            <div class="suggested-user">
              <div class="avatar avatar-sm">${initials}</div>
              <div class="suggested-user-info">
                <div class="suggested-user-name">${user.username}</div>
                <div class="suggested-user-meta">${levelDisplay} &middot; ${formatXP(user.xp || 0)} XP</div>
              </div>
              <button class="btn btn-sm btn-primary btn-add-friend"
                      onclick="handleAddFriend('${user.id}', this)">
                Add
              </button>
            </div>
          `;
        }).join('');
      }

      container.innerHTML = html;
    }

    /* ── Search filtering ── */
    friendSearchInput.addEventListener('input', (e) => {
      renderSuggestedUsers(e.target.value);
    });

    /* ── Add Friend ── */
    async function handleAddFriend(userId, btn) {
      if (btn.classList.contains('sent')) return;
      if (friends.length >= MAX_FRIENDS) {
        showToast('You can only add up to ' + MAX_FRIENDS + ' friends.');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Adding...';

      const res = await API.addFriend(userId);

      if (!res.error) {
        btn.classList.add('sent', 'btn-secondary');
        btn.classList.remove('btn-primary');
        btn.textContent = 'Added';

        // Refresh friends list and leaderboard
        const friendsRes = await API.getFriends();
        if (friendsRes.friends) {
          friends = friendsRes.friends;
          friendIds = new Set(friends.map(f => String(f.id)));
          renderFriends();
          renderLeaderboard();
          renderYourRankCard();
          renderSuggestedUsers(friendSearchInput.value);
          applyUserProfilePic();
        }

        showToast('Friend added!');
      } else {
        btn.disabled = false;
        btn.textContent = 'Add';
        showToast(res.error || 'Failed to add friend');
      }
    }

    /* ── Initialize: fetch data from API ── */
    async function initPage() {
      const user = await requireLogin();
      if (!user) return;

      // Fetch leaderboard and friends in parallel
      const [leaderboardRes, friendsRes] = await Promise.all([
        API.getLeaderboard(),
        API.getFriends()
      ]);

      // Process leaderboard data
      if (leaderboardRes && !leaderboardRes.error) {
        leaderboardData = leaderboardRes.leaderboard || [];
        currentUser = leaderboardRes.currentUser || null;
      }

      // Process friends data
      if (friendsRes && !friendsRes.error) {
        friends = friendsRes.friends || [];
        friendIds = new Set(friends.map(f => String(f.id)));
      }

      // Render everything
      renderYourRankCard();
      renderLeaderboard();
      renderFriends();
      // Apply saved profile pic to user avatars
      applyUserProfilePic();
    }

    initPage();
  </script>
</body>
</html>
