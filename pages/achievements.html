<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Achievements — MindShift</title>
  <meta name="description" content="Track your learning milestones, earned achievements, and progress toward new goals on MindShift.">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Design System -->
  <link rel="stylesheet" href="../css/design-system.css">

  <!-- Page-specific styles -->
  <style>
    /* ---- Summary Stats ---- */
    .summary-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--space-6);
      margin-bottom: var(--space-8);
    }

    .stat-card .stat-sub {
      font-size: var(--text-xs);
      color: var(--color-text-tertiary);
      font-weight: var(--weight-medium);
      margin-top: var(--space-1);
    }

    .stat-card .stat-icon {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: var(--space-3);
    }

    .stat-card .stat-icon svg {
      width: 20px;
      height: 20px;
    }

    .stat-icon-blue {
      background: var(--color-accent-blue);
      color: var(--color-action-blue);
    }

    .stat-icon-green {
      background: var(--color-success-bg);
      color: var(--color-success);
    }

    .stat-icon-navy {
      background: var(--color-accent-blue);
      color: var(--color-navy);
    }

    .stat-card-level .stat-progress {
      margin-top: var(--space-3);
    }

    .stat-card-level .stat-progress-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--space-1);
    }

    .stat-card-level .stat-progress-label span {
      font-size: var(--text-xs);
      color: var(--color-text-tertiary);
      font-weight: var(--weight-medium);
    }

    /* ---- Achievement Grid ---- */
    .achievements-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--space-5);
      margin-bottom: var(--space-8);
    }

    /* ---- Achievement Card Base ---- */
    .achievement-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: var(--space-5);
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
      position: relative;
      transition: transform var(--transition-base), box-shadow var(--transition-base), opacity 0.35s var(--ease-out);
    }

    /* ---- Earned State ---- */
    .achievement-card.earned {
      background: var(--color-accent-blue-light);
      border-color: rgba(37, 99, 235, 0.15);
    }

    .achievement-card.earned:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
    }

    .achievement-card-check {
      position: absolute;
      top: var(--space-3);
      right: var(--space-3);
      width: 22px;
      height: 22px;
      border-radius: var(--radius-full);
      background: var(--color-action-blue);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .achievement-card-check svg {
      width: 12px;
      height: 12px;
      color: #fff;
    }

    /* ---- Locked State ---- */
    .achievement-card.locked {
      background: var(--color-bg);
      border-color: var(--color-border-light);
      opacity: 0.7;
    }

    .achievement-card.locked:hover {
      transform: none;
      box-shadow: none;
    }

    .achievement-card.locked .achievement-card-icon {
      opacity: 0.4;
    }

    .achievement-card.locked .achievement-card-name {
      color: var(--color-text-tertiary);
    }

    .achievement-card.locked .achievement-card-desc {
      color: var(--color-text-tertiary);
      opacity: 0.7;
    }

    .achievement-card-lock {
      position: absolute;
      top: var(--space-3);
      right: var(--space-3);
      color: var(--color-text-tertiary);
      opacity: 0.5;
    }

    .achievement-card-lock svg {
      width: 14px;
      height: 14px;
    }

    /* ---- Card Icon ---- */
    .achievement-card-icon {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .achievement-card-icon svg {
      width: 20px;
      height: 20px;
    }

    .icon-learning {
      background: var(--color-accent-blue);
      color: var(--color-action-blue);
    }

    .icon-community {
      background: var(--color-success-bg);
      color: var(--color-success);
    }

    .icon-streaks {
      background: var(--color-warning-bg);
      color: var(--color-warning);
    }

    .icon-mastery {
      background: #F3EFFF;
      color: #6D28D9;
    }

    [data-theme="dark"] .icon-mastery {
      background: rgba(109, 40, 217, 0.15);
      color: #A78BFA;
    }

    /* ---- Card Content ---- */
    .achievement-card-name {
      font-size: var(--text-sm);
      font-weight: var(--weight-semibold);
      color: var(--color-text-primary);
      line-height: var(--leading-tight);
    }

    .achievement-card-desc {
      font-size: var(--text-xs);
      color: var(--color-text-secondary);
      line-height: var(--leading-normal);
    }

    .achievement-card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: auto;
      gap: var(--space-2);
    }

    .achievement-card-xp {
      font-size: var(--text-xs);
      font-weight: var(--weight-semibold);
      color: var(--color-action-blue);
    }

    .achievement-card.locked .achievement-card-xp {
      color: var(--color-text-tertiary);
    }

    /* ---- Progress for Locked Cards ---- */
    .achievement-card-progress {
      width: 100%;
    }

    .achievement-card-progress-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--space-1);
    }

    .achievement-card-progress-label span {
      font-size: var(--text-xs);
      color: var(--color-text-tertiary);
      font-weight: var(--weight-medium);
    }

    /* ---- Level Progression Section ---- */
    .level-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: var(--space-6);
      margin-bottom: var(--space-8);
    }

    .level-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--space-5);
    }

    .level-info h3 {
      font-size: var(--text-md);
      font-weight: var(--weight-semibold);
      color: var(--color-text-primary);
      margin-bottom: var(--space-1);
    }

    .level-info p {
      font-size: var(--text-sm);
      color: var(--color-text-secondary);
    }

    .level-badge {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      padding: var(--space-2) var(--space-4);
      background: var(--color-accent-blue);
      border-radius: var(--radius-full);
      font-size: var(--text-sm);
      font-weight: var(--weight-semibold);
      color: var(--color-deep-blue);
    }

    .level-progress-row {
      display: flex;
      align-items: center;
      gap: var(--space-4);
    }

    .level-label {
      font-size: var(--text-xs);
      font-weight: var(--weight-semibold);
      color: var(--color-text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    .level-label.current {
      color: var(--color-action-blue);
    }

    .level-progress-bar-wrap {
      flex: 1;
    }

    .level-xp-text {
      text-align: right;
      font-size: var(--text-xs);
      color: var(--color-text-tertiary);
      margin-top: var(--space-2);
    }

    .level-xp-text strong {
      color: var(--color-text-primary);
      font-weight: var(--weight-semibold);
    }

    /* ---- Tab Filter Fade ---- */
    .achievement-card.filter-hidden {
      display: none;
    }

    .achievement-card.filter-visible {
      animation: achievementFadeIn 0.35s var(--ease-out) both;
    }

    @keyframes achievementFadeIn {
      from {
        opacity: 0;
        transform: scale(0.96) translateY(8px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .achievement-card.locked.filter-visible {
      animation: achievementFadeInMuted 0.35s var(--ease-out) both;
    }

    @keyframes achievementFadeInMuted {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 0.7;
        transform: translateY(0);
      }
    }

    /* ---- Scroll-triggered progress bar animation ---- */
    .progress-bar-fill[data-width] {
      width: 0;
      transition: width 0.8s var(--ease-out);
    }

    .progress-bar-fill[data-width].progress-animated {
      /* width set via JS */
    }

    /* ---- Earned card scale entrance ---- */
    .achievement-card.earned[data-animate].animate-in {
      animation: earnedScaleIn 0.5s var(--ease-out) both;
    }

    @keyframes earnedScaleIn {
      from {
        opacity: 0;
        transform: scale(0.92);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .achievement-card.locked[data-animate].animate-in {
      animation: lockedFadeIn 0.5s var(--ease-out) both;
    }

    @keyframes lockedFadeIn {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 0.7;
        transform: translateY(0);
      }
    }

    /* ---- Motivational Message ---- */
    .achievements-empty-message {
      grid-column: 1 / -1;
      text-align: center;
      padding: var(--space-8) var(--space-4);
      color: var(--color-text-secondary);
      font-size: var(--text-sm);
    }

    .achievements-empty-message svg {
      width: 48px;
      height: 48px;
      color: var(--color-text-tertiary);
      margin-bottom: var(--space-3);
      opacity: 0.5;
    }

    .achievements-empty-message p {
      margin-top: var(--space-2);
      font-size: var(--text-md);
      font-weight: var(--weight-semibold);
      color: var(--color-text-primary);
    }

    .achievements-empty-message .sub {
      font-size: var(--text-sm);
      font-weight: var(--weight-normal);
      color: var(--color-text-tertiary);
      margin-top: var(--space-1);
    }

    /* ---- Earned Date ---- */
    .achievement-card-date {
      font-size: var(--text-xs);
      color: var(--color-text-tertiary);
      font-weight: var(--weight-medium);
    }

    /* ---- Responsive ---- */
    @media (max-width: 1200px) {
      .achievements-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 1024px) {
      .summary-stats {
        grid-template-columns: repeat(3, 1fr);
      }

      .achievements-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 768px) {
      .summary-stats {
        grid-template-columns: 1fr;
      }

      .achievements-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .level-header {
        flex-direction: column;
        align-items: flex-start;
        gap: var(--space-3);
      }

      .level-progress-row {
        flex-direction: column;
        align-items: stretch;
        gap: var(--space-2);
      }

      .level-progress-labels {
        justify-content: space-between;
      }

      .tab-bar {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }
    }

    @media (max-width: 480px) {
      .achievements-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>
  <div id="sidebar-container"></div>
  <div id="topbar-container"></div>

  <div class="page-layout">
    <main class="page-content" role="main">

      <!-- 1. Page Header -->
      <div class="page-header" data-animate>
        <h1>Achievements</h1>
        <p>Track your learning milestones</p>
      </div>

      <!-- Level Progression (moved to top) -->
      <section class="level-card" aria-label="Level progression" data-animate id="level-section-top">
        <div class="level-header">
          <div class="level-info">
            <h3>Level Progression</h3>
            <p id="level-remaining-text">-- XP to reach next level</p>
          </div>
          <div class="level-badge" id="level-badge">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c6 3 10 0 12-1v-4"/></svg>
            <span id="level-badge-text">Level --</span>
          </div>
        </div>
        <div class="level-progress-row">
          <span class="level-label current" id="level-current-label">Lvl --</span>
          <div class="level-progress-bar-wrap">
            <div class="progress-bar">
              <div class="progress-bar-fill" id="level-progress-fill" data-width="0" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" aria-label="Level progress"></div>
            </div>
            <div class="level-xp-text" id="level-xp-text">
              <strong>--</strong> / -- XP
            </div>
          </div>
          <span class="level-label" id="level-next-label">Lvl --</span>
        </div>
      </section>

      <!-- 2. Summary Stats -->
      <section class="summary-stats" aria-label="Achievement summary">
        <div class="stat-card" data-animate>
          <div class="stat-icon stat-icon-blue">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg>
          </div>
          <div class="stat-label">Earned</div>
          <div class="stat-value" id="stat-earned">-- <span class="text-sm text-tertiary font-medium">of --</span></div>
        </div>

        <div class="stat-card" data-animate>
          <div class="stat-icon stat-icon-green">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
          </div>
          <div class="stat-label">Total XP</div>
          <div class="stat-value" id="stat-xp">--</div>
        </div>

        <div class="stat-card stat-card-level" data-animate>
          <div class="stat-icon stat-icon-navy">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c6 3 10 0 12-1v-4"/></svg>
          </div>
          <div class="stat-label">Level</div>
          <div class="stat-value" id="stat-level-name">--</div>
          <div class="stat-sub" id="stat-level-num">--</div>
          <div class="stat-progress" id="stat-level-progress">
            <div class="stat-progress-label">
              <span id="stat-progress-label-text">Progress</span>
              <span id="stat-progress-label-pct">--%</span>
            </div>
            <div class="progress-bar progress-bar-sm">
              <div class="progress-bar-fill" id="stat-progress-bar" data-width="0" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" aria-label="Level progress"></div>
            </div>
          </div>
        </div>
      </section>

      <!-- 3. Category Tabs + 4. Achievements Grid -->
      <section class="section" aria-label="Achievements by category">
        <nav class="tab-bar" role="tablist" aria-label="Achievement categories" data-animate>
          <button class="tab active" role="tab" aria-selected="true" data-category="all">All</button>
          <button class="tab" role="tab" aria-selected="false" data-category="learning">Learning</button>
          <button class="tab" role="tab" aria-selected="false" data-category="community">Community</button>
          <button class="tab" role="tab" aria-selected="false" data-category="streaks">Streaks</button>
          <button class="tab" role="tab" aria-selected="false" data-category="mastery">Mastery</button>
        </nav>

        <div class="achievements-grid" id="achievements-grid">
          <!-- Dynamically populated -->
        </div>
      </section>

      <!-- Level progression section moved to top -->

    </main>
  </div>

  <!-- API + Shared JS -->
  <script src="../js/api.js"></script>
  <script src="../js/shared.js"></script>
  <script>
    /* ---- Render layout shell ---- */
    document.getElementById('sidebar-container').innerHTML = renderSidebar();
    document.getElementById('topbar-container').innerHTML = renderTopbar('Achievements');
    initSidebar();

    /* ---- Level thresholds ---- */
    var LEVEL_THRESHOLDS = [
      { level: 1, name: 'Beginner',   minXp: 0,    maxXp: 99 },
      { level: 2, name: 'Explorer',   minXp: 100,  maxXp: 399 },
      { level: 3, name: 'Learner',    minXp: 400,  maxXp: 799 },
      { level: 4, name: 'Apprentice', minXp: 800,  maxXp: 1499 },
      { level: 5, name: 'Scholar',    minXp: 1500, maxXp: 2499 },
      { level: 6, name: 'Expert',     minXp: 2500, maxXp: 3499 },
      { level: 7, name: 'Sage',       minXp: 3500, maxXp: 4999 },
      { level: 8, name: 'Master',     minXp: 5000, maxXp: Infinity }
    ];

    function getLevelInfo(xp) {
      var current = LEVEL_THRESHOLDS[0];
      for (var i = 0; i < LEVEL_THRESHOLDS.length; i++) {
        if (xp >= LEVEL_THRESHOLDS[i].minXp) {
          current = LEVEL_THRESHOLDS[i];
        }
      }
      var nextIdx = current.level < 8 ? current.level : null;
      var next = nextIdx !== null ? LEVEL_THRESHOLDS[nextIdx] : null;
      var nextLevelXp = next ? next.minXp : current.minXp;
      var levelRangeStart = current.minXp;
      var levelRangeEnd = next ? next.minXp : current.minXp;
      var progressPct = 0;
      if (next) {
        var range = levelRangeEnd - levelRangeStart;
        progressPct = range > 0 ? Math.round(((xp - levelRangeStart) / range) * 100) : 100;
      } else {
        progressPct = 100;
      }
      var remaining = next ? (nextLevelXp - xp) : 0;
      return {
        level: current.level,
        name: current.name,
        nextLevel: next ? next.level : null,
        nextName: next ? next.name : null,
        nextLevelXp: nextLevelXp,
        levelRangeStart: levelRangeStart,
        progressPct: Math.min(progressPct, 100),
        remaining: Math.max(remaining, 0)
      };
    }

    /* ---- SVG icon helpers ---- */
    var CATEGORY_ICONS = {
      learning: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>',
      community: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>',
      streaks: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>',
      mastery: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>'
    };

    var CHECK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
    var LOCK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>';

    var CATEGORY_BADGE_CLASS = {
      learning: 'badge-blue',
      community: 'badge-green',
      streaks: 'badge-yellow',
      mastery: 'badge-gray'
    };

    function formatDate(dateStr) {
      if (!dateStr) return '';
      var d = new Date(dateStr);
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function formatNumber(n) {
      if (n == null) return '--';
      return n.toLocaleString();
    }

    function categoryLabel(cat) {
      if (!cat) return '';
      return cat.charAt(0).toUpperCase() + cat.slice(1).toLowerCase();
    }

    /* ---- Render a single achievement card ---- */
    function renderAchievementCard(a, index) {
      var cat = (a.category || '').toLowerCase();
      var isEarned = !!a.earned;
      var stateClass = isEarned ? 'earned' : 'locked';
      var iconClass = 'icon-' + cat;
      var catIcon = CATEGORY_ICONS[cat] || CATEGORY_ICONS.learning;
      var badgeClass = CATEGORY_BADGE_CLASS[cat] || 'badge-gray';

      var html = '<article class="achievement-card ' + stateClass + '" data-animate data-category="' + cat + '" style="animation-delay:' + (index * 0.04) + 's">';

      if (isEarned) {
        html += '<span class="achievement-card-check" aria-label="Earned">' + CHECK_ICON + '</span>';
      } else {
        html += '<span class="achievement-card-lock" aria-label="Locked">' + LOCK_ICON + '</span>';
      }

      html += '<div class="achievement-card-icon ' + iconClass + '">' + catIcon + '</div>';
      html += '<h4 class="achievement-card-name">' + (a.name || '') + '</h4>';
      html += '<p class="achievement-card-desc">' + (a.description || '') + '</p>';

      html += '<div class="achievement-card-footer">';
      html += '<span class="badge ' + (isEarned ? badgeClass : 'badge-gray') + '">' + categoryLabel(a.category) + '</span>';
      html += '<span class="achievement-card-xp">' + (a.xp || 0) + ' XP</span>';
      html += '</div>';

      if (isEarned && a.earnedAt) {
        html += '<div class="achievement-card-date">Earned ' + formatDate(a.earnedAt) + '</div>';
      }

      if (!isEarned) {
        var pct = a.progressPercent || 0;
        html += '<div class="achievement-card-progress">';
        html += '<div class="achievement-card-progress-label">';
        html += '<span>Progress</span>';
        html += '<span>' + pct + '%</span>';
        html += '</div>';
        html += '<div class="progress-bar progress-bar-sm">';
        html += '<div class="progress-bar-fill" data-width="' + pct + '" role="progressbar" aria-valuenow="' + pct + '" aria-valuemin="0" aria-valuemax="100"></div>';
        html += '</div>';
        html += '</div>';
      }

      html += '</article>';
      return html;
    }

    /* ---- Page initialization ---- */
    (async function () {
      await requireLogin();

      var data;
      try {
        data = await API.getAchievements();
      } catch (e) {
        data = { achievements: [], earned: 0, total: 0, xp: 0, level: 1, levelName: 'Beginner' };
      }

      var achievements = data.achievements || [];
      var earnedCount = data.earned || 0;
      var totalCount = data.total || achievements.length || 0;
      var xp = data.xp || 0;
      var levelInfo = getLevelInfo(xp);

      /* --- Summary Stats --- */
      document.getElementById('stat-earned').innerHTML = formatNumber(earnedCount) + ' <span class="text-sm text-tertiary font-medium">of ' + formatNumber(totalCount) + '</span>';
      document.getElementById('stat-xp').textContent = formatNumber(xp);
      document.getElementById('stat-level-name').textContent = levelInfo.name;
      document.getElementById('stat-level-num').textContent = 'Level ' + levelInfo.level;

      if (levelInfo.nextLevel) {
        var statPct = levelInfo.progressPct;
        document.getElementById('stat-progress-label-text').textContent = 'Progress to Level ' + levelInfo.nextLevel;
        document.getElementById('stat-progress-label-pct').textContent = statPct + '%';
        var statBar = document.getElementById('stat-progress-bar');
        statBar.setAttribute('data-width', statPct);
        statBar.setAttribute('aria-valuenow', statPct);
        statBar.setAttribute('aria-label', formatNumber(xp) + ' of ' + formatNumber(levelInfo.nextLevelXp) + ' XP');
      } else {
        document.getElementById('stat-progress-label-text').textContent = 'Max level reached';
        document.getElementById('stat-progress-label-pct').textContent = '100%';
        var statBar = document.getElementById('stat-progress-bar');
        statBar.setAttribute('data-width', '100');
        statBar.setAttribute('aria-valuenow', '100');
      }

      /* --- Level Progression Section --- */
      if (levelInfo.nextLevel) {
        document.getElementById('level-remaining-text').textContent = formatNumber(levelInfo.remaining) + ' XP to reach Level ' + levelInfo.nextLevel;
      } else {
        document.getElementById('level-remaining-text').textContent = 'You have reached the maximum level!';
      }
      document.getElementById('level-badge-text').textContent = 'Level ' + levelInfo.level + ': ' + levelInfo.name;
      document.getElementById('level-current-label').textContent = 'Lvl ' + levelInfo.level;

      var levelFill = document.getElementById('level-progress-fill');
      levelFill.setAttribute('data-width', levelInfo.progressPct);
      levelFill.setAttribute('aria-valuenow', levelInfo.progressPct);
      levelFill.setAttribute('aria-label', 'Level progress: ' + formatNumber(xp) + ' of ' + formatNumber(levelInfo.nextLevelXp || xp) + ' XP');

      if (levelInfo.nextLevel) {
        document.getElementById('level-next-label').textContent = 'Lvl ' + levelInfo.nextLevel;
        document.getElementById('level-xp-text').innerHTML = '<strong>' + formatNumber(xp) + '</strong> / ' + formatNumber(levelInfo.nextLevelXp) + ' XP &mdash; ' + formatNumber(levelInfo.remaining) + ' XP remaining';
      } else {
        document.getElementById('level-next-label').textContent = 'Max';
        document.getElementById('level-xp-text').innerHTML = '<strong>' + formatNumber(xp) + '</strong> XP &mdash; Max level reached';
      }

      /* --- Achievement Cards --- */
      var grid = document.getElementById('achievements-grid');
      var html = '';

      if (achievements.length === 0) {
        html = '<div class="achievements-empty-message">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg>' +
          '<p>Start learning to unlock your first achievement!</p>' +
          '<div class="sub">Complete lessons, join sessions, and build streaks to earn achievements.</div>' +
          '</div>';
      } else {
        /* Check if this is a new user with 0 earned achievements */
        var hasAnyEarned = achievements.some(function (a) { return !!a.earned; });

        for (var i = 0; i < achievements.length; i++) {
          html += renderAchievementCard(achievements[i], i);
        }

        if (!hasAnyEarned) {
          html += '<div class="achievements-empty-message" style="margin-top: var(--space-4);">' +
            '<p>Start learning to unlock your first achievement!</p>' +
            '</div>';
        }
      }

      grid.innerHTML = html;

      /* --- Tab filtering --- */
      initTabFiltering();

      /* --- Progress bar animation --- */
      initProgressBarAnimation();
    })();

    /* ---- Category tab filtering ---- */
    function initTabFiltering() {
      var tabs = document.querySelectorAll('.tab-bar .tab');
      var grid = document.getElementById('achievements-grid');

      tabs.forEach(function (tab) {
        tab.addEventListener('click', function () {
          tabs.forEach(function (t) {
            t.classList.remove('active');
            t.setAttribute('aria-selected', 'false');
          });
          tab.classList.add('active');
          tab.setAttribute('aria-selected', 'true');

          var category = tab.getAttribute('data-category');
          var cards = grid.querySelectorAll('.achievement-card');
          var delay = 0;

          cards.forEach(function (card) {
            var cardCategory = card.getAttribute('data-category');
            var match = category === 'all' || cardCategory === category;

            card.classList.remove('filter-visible', 'filter-hidden');

            if (match) {
              card.classList.remove('filter-hidden');
              card.style.display = '';
              card.style.animationDelay = delay * 0.05 + 's';
              card.classList.add('filter-visible');
              delay++;
            } else {
              card.style.display = 'none';
              card.classList.add('filter-hidden');
            }
          });

          /* Show/hide empty message */
          var emptyMsg = grid.querySelector('.achievements-empty-message');
          if (emptyMsg) {
            emptyMsg.style.display = '';
          }
        });
      });
    }

    /* ---- Progress bar animation on scroll ---- */
    function initProgressBarAnimation() {
      var progressBars = document.querySelectorAll('.progress-bar-fill[data-width]');
      var observer = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            var target = entry.target;
            var width = target.getAttribute('data-width');
            requestAnimationFrame(function () {
              target.style.width = width + '%';
              target.classList.add('progress-animated');
            });
            observer.unobserve(target);
          }
        });
      }, { threshold: 0.2, rootMargin: '0px 0px -20px 0px' });

      progressBars.forEach(function (bar) {
        observer.observe(bar);
      });
    }
  </script>
</body>
</html>
